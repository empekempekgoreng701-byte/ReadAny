        .map(function(item) { return item.content; });
    }

    function isRectVisibleInReader(rect, renderer, win, doc) {
      if (!rect || rect.width <= 0 || rect.height <= 0) return false;
      const isPaginated = !renderer.scrolled;
      if (isPaginated && renderer.size > 0) {
        const visibleRange = getVisibleRangeForTTSDoc(doc, renderer);
        return visibleRange ? rectIntersectsPaginatedRange(rect, visibleRange) : false;
      }
      return isHostRectVisible(mapIframeRectToHost(rect, doc));
    }

    function isRangeVisibleInReader(range, renderer, win) {
      if (!range || !renderer || !win) return false;
      try {
        const rects = Array.from(range.getClientRects ? range.getClientRects() : []);
        const doc = getRangeDocument(range);
        if (!rects.length) {
          return isRectVisibleInReader(range.getBoundingClientRect(), renderer, win, doc);
        }
        return rects.some((rect) => isRectVisibleInReader(rect, renderer, win, doc));
      } catch (e) {
        console.log('[visibleTTSSegments] failed to inspect range rects:', e);
        return false;
      }
    }

    function isRangeStartVisibleInReader(range, renderer, win) {
      if (!range || !renderer || !win) return false;
      try {
        const rects = Array.from(range.getClientRects ? range.getClientRects() : []);
        const doc = getRangeDocument(range);
        if (!rects.length) {
          return isRectVisibleInReader(range.getBoundingClientRect(), renderer, win, doc);
        }
        return isRectVisibleInReader(rects[0], renderer, win, doc);
      } catch (e) {
        console.log('[visibleTTSSegments] failed to inspect range start rect:', e);
        return false;
      }
    }

    function getVisibleBlocksForTTS(doc, renderer) {
      const blockSelector = "p, h1, h2, h3, h4, h5, h6, li, blockquote, dd, dt, figcaption, pre, td, th";
      const blocks = doc.querySelectorAll(blockSelector);
      const win = doc.defaultView;
      if (!win) return [];
      return Array.from(blocks).filter((block) => {
        if (!block || !block.textContent || !block.textContent.trim()) return false;
        if (shouldSkipTTSNode(block)) return false;
        try {
          const range = doc.createRange();
          range.selectNodeContents(block);
          return isRangeVisibleInReader(range, renderer, win);
        } catch (e) {
          return isRectVisibleInReader(block.getBoundingClientRect(), renderer, win, doc);
        }
      });
    }

    function getReadableBlocksForTTS(doc) {
      const blockSelector = "p, h1, h2, h3, h4, h5, h6, li, blockquote, dd, dt, figcaption, pre, td, th";
      return Array.from(doc.querySelectorAll(blockSelector)).filter((block) => {
        if (!block || !block.textContent || !block.textContent.trim()) return false;
        if (shouldSkipTTSNode(block)) return false;
        return true;
      });
    }

    function resolveTextPosition(textNodes, absoluteOffset, isEnd) {
      if (!textNodes.length) return null;
      for (var i = 0; i < textNodes.length; i++) {
        var item = textNodes[i];
        if (absoluteOffset < item.end || (isEnd && absoluteOffset <= item.end)) {
          return {
            node: item.node,
            offset: Math.max(0, Math.min(item.node.nodeValue.length, absoluteOffset - item.start)),
          };
        }
      }
      const last = textNodes[textNodes.length - 1];
      return { node: last.node, offset: last.node.nodeValue.length };
    }

    function fallbackSentenceSegments(text) {
      const normalized = normalizeTTSText(text);
      if (!normalized) return [];
      const matches = normalized.match(/[^。！？!?；;\n]+[。！？!?；;…]?/gu) || [];
      return (matches.length ? matches : [normalized]).map((segment) => segment.trim()).filter(Boolean);
    }

    const TTS_FOOTNOTE_MARKER_PATTERN = /(?:\s*(?:\[(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})\]|［(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})］|【(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})】|〔(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})〕|［?（(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})）］?|\((?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})\)))+/gu;
    const TTS_FOOTNOTE_MARKER_ONLY_PATTERN = /^(?:\s*(?:\[(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})\]|［(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})］|【(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})】|〔(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})〕|［?（(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})）］?|\((?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})\)))+\s*$/u;
    const TTS_SKIPPED_ELEMENT_SELECTOR = [
      'script',
      'style',
      'rt',
      'rp',
      'sup',
      '.readany-translation',
      '[role="doc-noteref"]',
      '[role="doc-footnote"]',
      '[epub\\:type~="noteref"]',
      '[epub\\:type~="footnote"]',
      '[type~="noteref"]',
      '[type~="footnote"]',
      'a[href^="#fn"]',
      'a[href^="#footnote"]',
      'a[href*="footnote"]',
      'a[href*="note"]',
      'a.noteref',
      'a.footnote',
      '.noteref',
      '.footnote',
      '.footnote-ref',
      '.endnote',
      '.duokan-footnote',
      '.calibre-footnote',
    ].join(',');

    function normalizeTTSText(text) {
      return String(text || '').replace(TTS_FOOTNOTE_MARKER_PATTERN, '').replace(/\s+/g, ' ').trim();
    }

    function isTTSFootnoteMarker(text) {
      return TTS_FOOTNOTE_MARKER_ONLY_PATTERN.test(String(text || ''));
    }

    function shouldSkipTTSNode(element) {
      return !!(element && element.closest && element.closest(TTS_SKIPPED_ELEMENT_SELECTOR));
    }

    function stripCfiAssertions(value) {
      return String(value || '').replace(/\[[^\]]*\]/g, '');
    }

    function getTTSCfiStartIdentity(cfi) {
      const raw = String(cfi || '').trim();
      if (!raw) return '';
      const inner = raw.startsWith('epubcfi(') && raw.endsWith(')')
        ? raw.slice(8, -1)
        : raw;
      const bangIndex = inner.indexOf('!');
      if (bangIndex < 0) return stripCfiAssertions(inner);

      const sectionPath = stripCfiAssertions(inner.slice(0, bangIndex));
      const localPath = stripCfiAssertions(inner.slice(bangIndex + 1));
      const commaIndex = localPath.indexOf(',');
      if (commaIndex < 0) return `${sectionPath}!${localPath}`;

      const commonPath = localPath.slice(0, commaIndex);
      const rangePath = localPath.slice(commaIndex + 1);
      const rangeEndIndex = rangePath.indexOf(',');
      const startPath = rangeEndIndex >= 0 ? rangePath.slice(0, rangeEndIndex) : rangePath;
      return `${sectionPath}!${commonPath}${startPath}`;
    }

    function getTTSSegmentIdentity(cfi, text) {
      return `${getTTSCfiStartIdentity(cfi)}::${normalizeTTSText(text)}`;
    }

    function summarizeTTSSegmentsForLog(segments, limit) {
      return (segments || []).slice(0, limit || 8).map(function(segment, index) {
        var text = normalizeTTSText(segment && segment.text);
        return {
          index: index,
          cfi: segment && segment.cfi || null,
          length: text.length,
          text: text,
        };
      });
    }

    function collectTTSSegmentsFromEngine(count, alignCfi, alignRange) {
      const tts = view && view.tts;
      if (!tts) return [];

      // Prefer range-based alignment (reliable boundary comparison) over CFI string
      // matching (fragile — depends on exact serialization equality).
      if (alignRange && typeof tts.from === 'function') {
        try {
          // tts.from() uses `range.end <= detailRange.start` comparison.
          // If we pass a full sentence range, range.end overshoots detailRange[0].start
          // and skips the first sentence. Collapse to start (caret) so the comparison
          // correctly lands on the sentence that CONTAINS the visible position.
          const caretRange = alignRange.cloneRange ? alignRange.cloneRange() : alignRange;
          if (caretRange.collapse) caretRange.collapse(true); // collapse to start
          tts.from(caretRange);
        } catch (e) {
          console.log('[visibleTTSSegments] tts.from() failed, falling back to alignCfi:', e);
          // fall through to CFI alignment below
          if (alignCfi && typeof tts.alignCfi === 'function') {
            try { tts.alignCfi(alignCfi); } catch {}
          }
        }
      } else if (alignCfi) {
        try {
          if (typeof tts.alignCfi === 'function') {
            tts.alignCfi(alignCfi);
          } else if (typeof tts.highlightCfi === 'function') {
            tts.highlightCfi(alignCfi);
          }
        } catch (e) {
          console.log('[visibleTTSSegments] failed to align tts detail cursor:', e);
        }
      }

      const total = Math.max(1, Number.isFinite(count) ? count : 1);
      const current =
        typeof tts.currentDetail === 'function'
          ? tts.currentDetail()
          : null;
      const following =
        typeof tts.collectDetails === 'function'
          ? tts.collectDetails(Math.max(0, total - (current ? 1 : 0)), {
              includeCurrent: false,
              offset: 1,
            })
          : [];

      const result = [];
      const seen = new Set();
      for (const detail of [current, ...(following || [])]) {
        if (!detail || !detail.text || !detail.cfi) continue;
        const text = normalizeTTSText(detail.text);
        const identity = getTTSSegmentIdentity(detail.cfi, text);
        if (!text || seen.has(identity)) continue;
        seen.add(identity);
        result.push({ text, cfi: detail.cfi });
      }
      return result;
    }

    function getTTSSegmentContextFromEngine(cfi, beforeCount, afterCount) {
      try {
        const tts = view && view.tts;
        if (!tts || !cfi) return { before: [], after: [] };

        const resolved = resolveRangeForCfi(cfi);
        try {
          if (resolved?.range && typeof tts.from === 'function') {
            const caretRange = resolved.range.cloneRange ? resolved.range.cloneRange() : resolved.range;
            if (caretRange.collapse) caretRange.collapse(true);
            tts.from(caretRange);
          } else if (typeof tts.alignCfi === 'function') {
            tts.alignCfi(cfi);
          } else if (typeof tts.highlightCfi === 'function') {
            tts.highlightCfi(cfi);
          }
        } catch (e) {
          console.log('[ttsSegmentContext] failed to align cfi:', e);
          return { before: [], after: [] };
        }

        const current =
          typeof tts.currentDetail === 'function'
            ? tts.currentDetail()
            : null;
        const currentText =
          current && current.text
            ? normalizeTTSText(current.text)
            : '';
        const currentIdentity = currentText ? getTTSSegmentIdentity(current && current.cfi, currentText) : null;

        const normalize = function(details) {
          const result = [];
          const seen = new Set();
          for (const detail of details || []) {
            if (!detail || !detail.text || !detail.cfi) continue;
            const text = normalizeTTSText(detail.text);
            const identity = getTTSSegmentIdentity(detail.cfi, text);
            if (!text || (currentIdentity && identity === currentIdentity) || seen.has(identity)) continue;
            seen.add(identity);
            result.push({ text, cfi: detail.cfi });
          }
          return result;
        };

        const before =
          typeof tts.collectDetails === 'function'
            ? tts.collectDetails(Math.max(0, beforeCount || 0), {
                includeCurrent: false,
                offset: -Math.max(0, beforeCount || 0),
              })
            : [];
        const after =
          typeof tts.collectDetails === 'function'
            ? tts.collectDetails(Math.max(0, afterCount || 0), {
                includeCurrent: false,
                offset: 1,
              })
            : [];

        return {
          before: normalize(before),
          after: normalize(after),
        };
      } catch (e) {
        console.log('[ttsSegmentContext] error:', e);
        return { before: [], after: [] };
      }
    }

    function extractTTSSegmentsFromDocument(doc, sectionIndex, maxCount, anchorRange) {
      try {
        if (!doc || !view || typeof view.getCFI !== 'function') return [];
        const blocks = getReadableBlocksForTTS(doc);
        const lang =
          doc.documentElement.lang ||
          doc.documentElement.getAttribute('xml:lang') ||
          (doc.body && doc.body.lang) ||
          navigator.language ||
          'en';
        const segmenter =
          typeof Intl !== 'undefined' && Intl.Segmenter
            ? new Intl.Segmenter(lang, { granularity: 'sentence' })
            : null;
        const limit = Math.max(1, maxCount || 24);
        const segments = [];
        const seen = new Set();
        const docNode = doc.defaultView && doc.defaultView.Node ? doc.defaultView.Node : Node;
        const anchorNode =
          anchorRange && anchorRange.startContainer
            ? (anchorRange.startContainer.nodeType === docNode.TEXT_NODE
                ? anchorRange.startContainer.parentElement
                : anchorRange.startContainer)
            : null;
        let started = !anchorNode;

        for (const block of blocks) {
          if (!started && anchorNode) {
            if (block === anchorNode || block.contains(anchorNode)) {
              started = true;
            } else if (
              anchorNode.compareDocumentPosition &&
              (anchorNode.compareDocumentPosition(block) & docNode.DOCUMENT_POSITION_FOLLOWING)
            ) {
              started = true;
            }
          }
          if (!started) continue;

          const textNodes = getTTSTextNodes(block).map((node) => {
            const text = node.nodeValue || '';
            return { node, text };
          }).filter((item) => item.text.trim().length > 0);
          if (!textNodes.length) continue;

          let absoluteText = '';
          const positionedNodes = textNodes.map((item) => {
            const start = absoluteText.length;
            absoluteText += item.text;
            return {
              node: item.node,
              start,
              end: absoluteText.length,
            };
          });

          const rawSegments = segmenter
            ? Array.from(segmenter.segment(absoluteText)).map((item) => ({
                start: item.index,
                end: item.index + item.segment.length,
              }))
            : fallbackSentenceSegments(absoluteText).reduce((acc, sentence) => {
                const start = absoluteText.indexOf(sentence, acc.lastIndex || 0);
                if (start >= 0) {
                  acc.items.push({ start, end: start + sentence.length });
                  acc.lastIndex = start + sentence.length;
                }
                return acc;
              }, { items: [], lastIndex: 0 }).items;
          const normalizedSegments = rawSegments.length
            ? rawSegments
            : [{ start: 0, end: absoluteText.length }];

          for (const rawSegment of normalizedSegments) {
            let start = rawSegment.start;
            let end = rawSegment.end;
            while (start < end && /\s/u.test(absoluteText[start])) start++;
            while (end > start && /\s/u.test(absoluteText[end - 1])) end--;
            if (end - start < 2) continue;

            const startPos = resolveTextPosition(positionedNodes, start, false);
            const endPos = resolveTextPosition(positionedNodes, end, true);
            if (!startPos || !endPos) continue;

            const range = doc.createRange();
            range.setStart(startPos.node, startPos.offset);
            range.setEnd(endPos.node, endPos.offset);

            const text = normalizeTTSText(absoluteText.slice(start, end));
            if (!text) continue;

            try {
              const cfi = view.getCFI(sectionIndex, range);
              const identity = getTTSSegmentIdentity(cfi, text);
              if (!cfi || seen.has(identity)) continue;
              seen.add(identity);
              segments.push({ text, cfi });
              if (segments.length >= limit) return segments;
            } catch (e) {
              console.log('[hrefTTSSegments] failed to convert range to CFI:', e);
            }
          }
        }

        return segments;
      } catch (e) {
        console.log('[hrefTTSSegments] extract error:', e);
        return [];
      }
    }

    async function getHrefTTSSegmentsFromBook(href, maxCount) {
      try {
        if (!href || !currentBook || !currentBook.sections || !view) return [];
        let resolved = null;
        try {
          if (typeof view.resolveNavigation === 'function') {
            resolved = await Promise.resolve(view.resolveNavigation(href));
          } else if (typeof currentBook.resolveHref === 'function') {
            resolved = await Promise.resolve(currentBook.resolveHref(href));
          }
        } catch (e) {
          console.log('[hrefTTSSegments] failed to resolve href:', href, e);
        }

        let sectionIndex = Number.isInteger(resolved && resolved.index) ? resolved.index : -1;
        if (sectionIndex < 0) {
          const hrefWithoutHash = String(href).split('#')[0];
          sectionIndex = Array.from(currentBook.sections).findIndex(function(section) {
            const sectionHref = String(section && section.href || '').split('#')[0];
            return sectionHref === href || sectionHref === hrefWithoutHash || sectionHref.endsWith('/' + hrefWithoutHash);
          });
        }
        if (sectionIndex < 0 || sectionIndex >= currentBook.sections.length) return [];
        const section = currentBook.sections[sectionIndex];
        if (!section || typeof section.createDocument !== 'function') return [];

        const doc = await section.createDocument();
        let anchorRange = null;
        if (resolved && typeof resolved.anchor === 'function') {
          try {
            anchorRange = anchorToRange(doc, resolved.anchor(doc));
          } catch (e) {
            anchorRange = null;
          }
        }

        return extractTTSSegmentsFromDocument(doc, sectionIndex, maxCount, anchorRange);
      } catch (e) {
        console.log('[hrefTTSSegments] error:', e);
        return [];
      }
    }

    function extractVisibleTTSSegments(alignCfi) {
      try {
        const renderer = view && view.renderer;
        const contents = getRendererContents();
        if (!renderer || !contents.length) return [];
        ttsVisibleRangeByDoc = new WeakMap();
        const scanContents = getVisibleContentsForTTS(contents, renderer);
        const segments = [];
        const stats = {
          contentsCount: contents.length,

          rawSentenceCount: 0,
          skippedTooShort: 0,
          skippedNoBoundary: 0,
          skippedNotStartVisible: 0,
          skippedNotVisible: 0,
          skippedEmptyText: 0,

        const seenVisibleIdentities = new Set();

        // Must be declared here (outer scope) so it's accessible after both loops close.
        let firstVisibleRange = null;

        for (var contentIndex = 0; contentIndex < scanContents.length; contentIndex++) {

          if (!current || !current.doc) continue;
          const doc = current.doc;
          const win = doc.defaultView;
          if (!win) continue;
          const sectionIndex = typeof current.index === 'number' ? current.index : currentSectionIndex;
          const visibleBlocks = getVisibleBlocksForTTS(doc, renderer);

          const lang =
            doc.documentElement.lang ||
            doc.documentElement.getAttribute('xml:lang') ||
            doc.body.lang ||

          const segmenter =
            typeof Intl !== 'undefined' && Intl.Segmenter
              ? new Intl.Segmenter(lang, { granularity: 'sentence' })
              : null;

          for (var blockIndex = 0; blockIndex < visibleBlocks.length; blockIndex++) {
            const block = visibleBlocks[blockIndex];
            const textNodes = getTTSTextNodes(block).map((node) => {
              const text = node.nodeValue || '';

            }).filter((item) => item.text.trim().length > 0);
            if (!textNodes.length) continue;

            var absoluteText = '';
            const positionedNodes = textNodes.map((item) => {
              const start = absoluteText.length;
              absoluteText += item.text;
              return {
                node: item.node,
                start,
                end: absoluteText.length,

            });

            const rawSegments = segmenter
              ? Array.from(segmenter.segment(absoluteText)).map((item) => ({
                  start: item.index,
                  end: item.index + item.segment.length,

              : fallbackSentenceSegments(absoluteText).reduce((acc, sentence) => {
                  const start = absoluteText.indexOf(sentence, acc.lastIndex || 0);
                  if (start >= 0) {
                    acc.items.push({ start, end: start + sentence.length });

                  }
                  return acc;
                }, { items: [], lastIndex: 0 }).items;

            const normalizedSegments = rawSegments.length
              ? rawSegments
              : [{ start: 0, end: absoluteText.length }];
            stats.rawSentenceCount += normalizedSegments.length;

            for (var si = 0; si < normalizedSegments.length; si++) {
              let start = normalizedSegments[si].start;
              let end = normalizedSegments[si].end;

              while (start < end && /\s/u.test(absoluteText[start])) start++;
              while (end > start && /\s/u.test(absoluteText[end - 1])) end--;
              if (end - start < 2) {
                stats.skippedTooShort++;
                continue;
              }

              const startPos = resolveTextPosition(positionedNodes, start, false);
              const endPos = resolveTextPosition(positionedNodes, end, true);
              if (!startPos || !endPos) {
                stats.skippedNoBoundary++;
                continue;
              }

              const range = doc.createRange();
              range.setStart(startPos.node, startPos.offset);
              range.setEnd(endPos.node, endPos.offset);
              if (!isRangeStartVisibleInReader(range, renderer, win)) {
                stats.skippedNotVisible++;
                stats.skippedNotStartVisible++;
                continue;
              }

              const text = normalizeTTSText(absoluteText.slice(start, end));
              if (!text) {
                stats.skippedEmptyText++;
                continue;
              }

              if (!firstVisibleRange) {
                firstVisibleRange = range;
              }

              try {
                const cfi = view && view.getCFI ? view.getCFI(sectionIndex, range) : '';
                if (cfi) {
                  const identity = getTTSSegmentIdentity(cfi, text);
                  if (seenVisibleIdentities.has(identity)) {
                    stats.skippedDuplicate++;
                    continue;
                  }
                  seenVisibleIdentities.add(identity);
                  segments.push({ text, cfi });
                } else {
                  stats.skippedCFI++;

        }

        // Use range-based alignment (preferred: uses boundary comparison, not CFI string equality)
        // Fall back to CFI string alignment for older tts.js builds without tts.from()
        const firstVisibleCfi = segments[0]?.cfi || null;
        const resolvedAlignRange = resolveRangeForCfi(alignCfi);
        const alignedSegments = segments.length
          ? collectTTSSegmentsFromEngine(
              alignCfi ? 500 : segments.length,
              alignCfi || firstVisibleCfi,
              resolvedAlignRange?.range || firstVisibleRange

          : [];
        let returnSource = segments.length ? 'direct-visible' : 'no-visible-segments';
        let filteredAlignedCount = 0;
        let filteredAlignedPreview = [];
        let returnedSegments = segments;
        if (alignedSegments.length && segments.length) {
          const visibleIdentities = new Set(
            segments.map((segment) => getTTSSegmentIdentity(segment.cfi, segment.text))

          const filtered = alignedSegments.filter((segment) =>
            visibleIdentities.has(getTTSSegmentIdentity(segment.cfi, segment.text))
          );
          filteredAlignedCount = filtered.length;
          filteredAlignedPreview = summarizeTTSSegmentsForLog(filtered, 8);
          if (filtered.length === segments.length) {
            returnSource = 'aligned-filtered';
            returnedSegments = filtered;
          } else if (filtered.length > 0) {
            returnSource = 'direct-partial-filtered-fallback';
            returnedSegments = segments;
          } else if (alignCfi) {
            const alignedStart = alignedSegments[0] || null;
            const alignedStartIdentity = alignedStart
              ? getTTSSegmentIdentity(alignedStart.cfi, alignedStart.text)
              : null;
            const visibleStartIndex = alignedStartIdentity
              ? segments.findIndex(
                  (segment) =>
                    getTTSSegmentIdentity(segment.cfi, segment.text) === alignedStartIdentity

              : -1;
            if (visibleStartIndex >= 0) {
              returnSource = 'direct-aligned-slice';
              returnedSegments = segments.slice(visibleStartIndex);
            } else {
              returnSource = 'direct-fallback';
              returnedSegments = segments;
            }
          } else {
            returnSource = 'direct-visible';
            returnedSegments = segments;
          }
        }

        window.__lastVisibleTTSDiagnostics = {
          alignCfi: alignCfi || null,
          firstVisibleCfi: firstVisibleCfi,
          firstVisibleText: segments[0] && segments[0].text || null,
          directCount: segments.length,
          alignedCount: alignedSegments.length,
          filteredAlignedCount: filteredAlignedCount,
          returnedCount: returnedSegments.length,
          returnSource: returnSource,
          stats: stats,
          directPreview: summarizeTTSSegmentsForLog(segments, 8),
          alignedPreview: summarizeTTSSegmentsForLog(alignedSegments, 8),
          filteredAlignedPreview: filteredAlignedPreview,
          returnedPreview: summarizeTTSSegmentsForLog(returnedSegments, 8),
        };
        console.log('[visibleTTSSegments] diagnostics', JSON.stringify(window.__lastVisibleTTSDiagnostics));
        return returnedSegments;
      } catch (e) {
        console.log('[visibleTTSSegments] extraction error:', e);
        const fallbackSegments = alignCfi
          ? collectTTSSegmentsFromEngine(500, alignCfi, resolveRangeForCfi(alignCfi)?.range || null)
          : [];
        window.__lastVisibleTTSDiagnostics = {
          alignCfi: alignCfi || null,
          extractionError: String(e),
          returnSource: alignCfi ? 'engine-align-fallback' : 'no-visible-segments',
          directCount: 0,
          alignedCount: fallbackSegments.length,
          filteredAlignedCount: 0,
          returnedCount: fallbackSegments.length,
          stats: {
            startVisibilityMode: 'range-intersection',
          },
          directPreview: [],
          alignedPreview: summarizeTTSSegmentsForLog(fallbackSegments, 8),
          filteredAlignedPreview: [],
          returnedPreview: summarizeTTSSegmentsForLog(fallbackSegments, 8),
        };
        console.log('[visibleTTSSegments] diagnostics', JSON.stringify(window.__lastVisibleTTSDiagnostics));
        return fallbackSegments;
      }
    }

    // ─── Chapter Extraction for Vectorization ───
    function isPDFBookMessage(msg) {
      const mimeType = (msg.mimeType || '').split(';')[0].trim().toLowerCase();
      return mimeType === 'application/pdf' || /\.pdf$/i.test(msg.fileName || '');
    }

    async function createBookFileFromMessage(msg) {
      if (msg.base64) {
        const binary = atob(msg.base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new File([bytes], msg.fileName || 'book.epub', {
          type: msg.mimeType || 'application/epub+zip'
        });
      }

      if (msg.uri) {
        const res = await fetch(msg.uri);
        const isLocalFileStatus = res.status === 0 && /^file:\/\//i.test(msg.uri);
        if (!res.ok && !isLocalFileStatus) throw new Error(`Failed to fetch: ${res.status}`);
        const blob = await res.blob();
        return new File([blob], msg.fileName || 'book.epub', {
          type: msg.mimeType || blob.type || 'application/octet-stream'
        });
      }

      throw new Error('No book data provided');
    }

              fileName: msg.fileName || '',
              mimeType: msg.mimeType || '',
              base64Length: msg.base64 ? msg.base64.length : 0

          });

          const file = await createBookFileFromMessage(msg);
          const chapters = await window._extractPDFChapters(file, {
            onProgress: (detail) => {

            }

    }

    async function handleExtractChapters() {
      if (!currentBook) {
        postToRN('chaptersExtracted', { error: 'No book loaded' });
        return;
      }

      try {
        const sections = currentBook.sections || [];
        const toc = currentBook.toc || [];

        // Build map of href to title mapping
        const tocMap = new Map();
        function walkToc(items) {
          for (const item of items) {
            if (item.label) {
              tocMap.set(item.index, item.label);
              if (item.href) {
                const base = item.href.split("#")[0];
                tocMap.set(base, item.label);
                tocMap.set(item.href, item.label);
              }
            }
            if (item.subitems && item.subitems.length) {
              walkToc(item.subitems);
            }
          }
        }
        walkToc(toc);

        const chapters = [];
        let skippedNoCreateDocument = 0;

        for (let i = 0; i < sections.length; i++) {
          const section = sections[i];
          if (!section.createDocument) {
            skippedNoCreateDocument += 1;
            continue;
          }

          try {
            const doc = await section.createDocument();
            if (!doc.body) continue;

            const title = tocMap.get(i) || tocMap.get(section.href || "") || `Section ${i + 1}`;
            const CFI = window.CFI || (window.EpubCFI && window.EpubCFI.fake ? window.EpubCFI : null);
            let baseCfi = section.cfi;

            // If CFI generation is available but no base cfi, try to fake it
            if (!baseCfi && typeof CFI?.fake?.fromIndex === 'function') {
              baseCfi = CFI.fake.fromIndex(i);
            } else if (!baseCfi) {
              baseCfi = `epubcfi(/6/${(i + 1) * 2}!)`; // Fallback approximate
            }

            const segments = extractSegmentsWithCfi(doc, baseCfi, CFI);
            if (segments.length === 0) continue;

            const content = segments.map(s => s.text).join("\\n\\n");
            chapters.push({ index: i, title, content, segments });

            // Reclaim memory
            doc.documentElement.innerHTML = "";
          } catch (err) {
            console.warn(`[WebView] Failed to extract section ${i}:`, err);
          }
        }

        console.log('[WebView] Chapter extraction summary:', {
          sections: sections.length,
          chapters: chapters.length,
          segments: chapters.reduce((sum, chapter) => sum + (chapter.segments?.length || 0), 0),
          skippedNoCreateDocument
        });

        postToRN('chaptersExtracted', { chapters });
      } catch (err) {
        console.error('[WebView] Error extracting chapters:', err);
        postToRN('chaptersExtracted', { error: String(err) });
      }
    }

    function extractSegmentsWithCfi(doc, baseCfi, CFI) {
      const segments = [];
      const body = doc.body;
      if (!body) return segments;

      const blockSelector = "p, h1, h2, h3, h4, h5, h6, li, blockquote, dd, dt, figcaption, pre, td, th";
      const blocks = body.querySelectorAll(blockSelector);

      if (blocks.length === 0) {
        const text = body.textContent?.trim();
        if (text) {
          segments.push({ text, cfi: baseCfi });
        }
        return segments;
      }

      for (let i = 0; i < blocks.length; i++) {
        const block = blocks[i];
        const text = extractBlockText(block);
        if (!text || text.length < 2) continue;

        try {
          if (!CFI) {
            segments.push({ text, cfi: baseCfi });
            continue;
          }

          const textNodes = getTextNodes(block);
          if (textNodes.length === 0) {
            segments.push({ text, cfi: baseCfi });
            continue;
          }

          const range = doc.createRange();
          const firstNode = textNodes[0];
          const lastNode = textNodes[textNodes.length - 1];

          range.setStart(firstNode, 0);
          range.setEnd(lastNode, lastNode.length);

          let rangeCfi = '';
          if (typeof CFI.fromRange === 'function') {
            rangeCfi = CFI.fromRange(range);
          } else if (CFI.Generator && typeof CFI.Generator.generateRangeComponent === 'function') {
            rangeCfi = CFI.Generator.generateRangeComponent(
              range.startContainer, range.startOffset,
              range.endContainer, range.endOffset
            );
          }

          let fullCfi = baseCfi;
          if (rangeCfi) {
            if (typeof CFI.joinIndir === 'function') {
              fullCfi = CFI.joinIndir(baseCfi, rangeCfi);
            } else {
              // naive join epubcfi(/a!) and epubcfi(/b) -> epubcfi(/a!/b)
              fullCfi = baseCfi.replace('!)', '!' + rangeCfi.replace('epubcfi(', ''));
            }
          }

          segments.push({ text, cfi: fullCfi });
        } catch (e) {
          segments.push({ text, cfi: baseCfi });
        }
      }
      return segments;
    }

    // ─── Chapter Translation Handlers ───

    function handleGetChapterParagraphs(requestedSectionIndex) {
      // Retry with exponential backoff to handle timing issues when renderer is not ready
      var maxRetries = 3;
      var retryDelay = 300; // ms
      var attempt = 0;

      function isReaderReady() {
        // Check if view.renderer is properly initialized
        if (!view || !view.renderer) return false;
        var renderer = view.renderer;
        if (!renderer.getContents) return false;
        var contents = renderer.getContents();
        if (!contents || !contents.length || !contents[0]) return false;
        return true;
      }

      function tryExtract() {
        attempt++;
        try {
          // Verify readiness before extraction
          if (!isReaderReady()) {
            if (attempt < maxRetries) {
              setTimeout(tryExtract, retryDelay * attempt);
              return;
            }
            postToRN('chapterParagraphs', { paragraphs: [], error: 'Reader not ready after ' + maxRetries + ' retries. Please wait for the chapter to fully load and try again.' });
            return;
          }

          // Resolve the document for the REQUESTED section — never blindly
          // use contents[0], which is often a preloaded neighbor section.
          var resolvedIndex = null;
          var doc = null;
          var indexed = getRendererContentForSection(requestedSectionIndex);
          if (indexed && indexed.doc) {
            doc = indexed.doc;
            resolvedIndex = indexed.index;
          }

          // Fallback: scan iframes if renderer document not available
          if (!doc) {
            var iframes = document.querySelectorAll('iframe');
            for (var fi = 0; fi < iframes.length; fi++) {
              try {
                var iframeDoc = iframes[fi].contentDocument || (iframes[fi].contentWindow && iframes[fi].contentWindow.document);
                if (iframeDoc && iframeDoc.body && iframeDoc.body.innerText && iframeDoc.body.innerText.trim().length > 0) {
                  doc = iframeDoc;
                  break;
                }
              } catch (e) { /* cross-origin, skip */ }
            }
          }

          if (!doc) {
            // Retry if attempts remaining
            if (attempt < maxRetries) {
              setTimeout(tryExtract, retryDelay * attempt);
              return;
            }
            postToRN('chapterParagraphs', { paragraphs: [], error: 'No chapter document found after ' + maxRetries + ' retries. The chapter may still be loading.' });
            return;
          }

          // Verify document has body and content
          if (!doc.body || !doc.body.innerText || doc.body.innerText.trim().length === 0) {
            if (attempt < maxRetries) {
              setTimeout(tryExtract, retryDelay * attempt);
              return;
            }
            postToRN('chapterParagraphs', { paragraphs: [], error: 'Chapter document is empty after ' + maxRetries + ' retries.' });
            return;
          }

          // Extract paragraphs from block-level elements
          var blockSelector = "p, h1, h2, h3, h4, h5, h6, li, blockquote, dd, dt, figcaption, pre, td, th";
          var blocks = doc.querySelectorAll(blockSelector);
          var paragraphs = [];
          for (var i = 0; i < blocks.length; i++) {
            var el = blocks[i];
            // Shared normalization (core translation-text bundle): byte-identical
            // to the background queue extractor so cache keys and source hashes
            // match across both paths. Fallback preserves the old behavior.
            var rawText = (el.innerText || el.textContent || '');
            var text = window.ReadAnyTranslationText
              ? window.ReadAnyTranslationText.normalizeParagraphText(rawText)
              : rawText.trim();
            if (text.length < 2) continue;
            var id = 'para_' + i;
            el.setAttribute('data-translate-id', id);
            paragraphs.push({ id: id, text: text, tagName: el.tagName.toLowerCase() });
          }

          // Retry if no paragraphs found
          if (paragraphs.length === 0) {
            if (attempt < maxRetries) {
              setTimeout(tryExtract, retryDelay * attempt);
              return;
            }
            postToRN('chapterParagraphs', { paragraphs: [], error: 'No text paragraphs found in chapter after ' + maxRetries + ' retries. The chapter may contain only images or the content is still loading.' });
            return;
          }

          postToRN('chapterParagraphs', { paragraphs: paragraphs, sectionIndex: resolvedIndex });
        } catch (err) {
          if (attempt < maxRetries) {
            setTimeout(tryExtract, retryDelay * attempt);
            return;
          }
          postToRN('chapterParagraphs', { paragraphs: [], error: 'Failed to extract chapter paragraphs: ' + String(err) });
        }
      }

      tryExtract();
    }

    function getReaderLayoutSignature(doc) {
      var root = doc && doc.documentElement;
      var body = doc && doc.body;
      var renderer = view && view.renderer;
      return [
        root ? root.scrollWidth : 0,
        root ? root.scrollHeight : 0,
        body ? body.scrollWidth : 0,
        body ? body.scrollHeight : 0,
        renderer && typeof renderer.page !== 'undefined' ? renderer.page : '',
        renderer && typeof renderer.pages !== 'undefined' ? renderer.pages : ''
      ].join(':');
    }

    function waitForReaderLayoutStable(doc) {
      return new Promise(function(resolve) {
        var win = (doc && doc.defaultView) || window;
        var requestFrame = win.requestAnimationFrame
          ? win.requestAnimationFrame.bind(win)
          : function(callback) { return setTimeout(function() { callback(Date.now()); }, 16); };
        var previous = getReaderLayoutSignature(doc);
        var stableFrames = 0;
        var frames = 0;

        function tick() {
          frames += 1;
          var next = getReaderLayoutSignature(doc);
          if (next === previous) {
            stableFrames += 1;
          } else {
            stableFrames = 0;
            previous = next;
          }

          if (stableFrames >= 2 || frames >= 12) {
            resolve();
            return;
          }

          requestFrame(tick);
        }

        requestFrame(tick);
      });
    }

    async function handleInjectChapterTranslations(results, visibility, sectionIndex) {
      try {
        visibility = visibility || { originalVisible: true, translationVisible: true };
        var doc = null;
        // Inject into the SAME section the paragraphs were extracted from.
        var indexed = getRendererContentForSection(sectionIndex);
        if (indexed && indexed.doc) {
          doc = indexed.doc;
        }
        if (!doc) {
          var iframes = document.querySelectorAll('iframe');
          for (var fi = 0; fi < iframes.length; fi++) {
            try {
              var iframeDoc = iframes[fi].contentDocument || (iframes[fi].contentWindow && iframes[fi].contentWindow.document);
              if (iframeDoc && iframeDoc.body) { doc = iframeDoc; break; }
            } catch (e) {}
          }
        }
        if (!doc) return;

        // Inject CSS once
        if (!doc.getElementById('readany-chapter-translation-style')) {
          var style = doc.createElement('style');
          style.id = 'readany-chapter-translation-style';
          style.textContent = [
            '.readany-translation {',
            '  color: #6b7280;',
            '  font-size: 0.9em;',
            '  line-height: 1.5;',
            '  margin-top: 4px;',
            '  margin-bottom: 8px;',
            '  padding-left: 8px;',
            '  border-left: 2px solid #d1d5db;',
            '  opacity: 0.85;',
            '}',
            '.readany-translation[data-hidden="true"] { display: none; }',
            '.readany-translation[data-solo="true"] { color: inherit; font-size: inherit; line-height: inherit; margin-top: 0; margin-bottom: 0.8em; padding-left: 0; border-left: none; opacity: 1; }',
            '[data-translate-id][data-original-hidden="true"] { display: none; }',
            '@media (prefers-color-scheme: dark) {',
            '  .readany-translation { color: #9ca3af; border-left-color: #4b5563; }',
            '}'
          ].join('\n');
          doc.head.appendChild(style);
        }

        for (var i = 0; i < results.length; i++) {
          var r = results[i];
          if (!r.translatedText) continue;
          var el = doc.querySelector('[data-translate-id="' + r.paragraphId + '"]');
          if (!el) continue;
          el.setAttribute('data-original-hidden', String(!visibility.originalVisible));
          // Skip if already injected
          if (el.nextElementSibling && el.nextElementSibling.classList.contains('readany-translation')) {
            el.nextElementSibling.setAttribute('data-hidden', String(!visibility.translationVisible));
            el.nextElementSibling.setAttribute('data-solo', String(!visibility.originalVisible && visibility.translationVisible));
            continue;
          }

          var div = doc.createElement('div');
          div.className = 'readany-translation';
          div.setAttribute('data-para-id', r.paragraphId);
          div.setAttribute('data-hidden', String(!visibility.translationVisible));
          div.setAttribute('data-solo', String(!visibility.originalVisible && visibility.translationVisible));
          div.textContent = r.translatedText;
          el.parentNode.insertBefore(div, el.nextSibling);
        }
        await waitForReaderLayoutStable(doc);
      } catch (err) {
        console.error('[WebView] Error injecting translations:', err);
      }
    }

    function handleRemoveChapterTranslations(sectionIndex) {
      try {
        // Sweep every loaded document so stale translations in preloaded
        // neighbor sections are removed as well.
        var docs = [];
        var contents = getRendererContents();
        for (var ci = 0; ci < contents.length; ci++) {
          if (contents[ci] && contents[ci].doc) docs.push(contents[ci].doc);
        }
        var doc = null;
        var indexed = getRendererContentForSection(sectionIndex);
        if (indexed && indexed.doc) {
          doc = indexed.doc;
        } else if (docs.length) {
          doc = docs[0];
        }
        if (!doc) {
          var iframes = document.querySelectorAll('iframe');
          for (var fi = 0; fi < iframes.length; fi++) {
            try {
              var iframeDoc = iframes[fi].contentDocument || (iframes[fi].contentWindow && iframes[fi].contentWindow.document);
              if (iframeDoc && iframeDoc.body) { doc = iframeDoc; break; }
            } catch (e) {}
          }
        }
        if (!doc) return;

        // Remove from the target doc plus every other loaded doc, so no
        // stale translation survives in preloaded neighbor sections.
        var sweepDocs = docs.length ? docs : [doc];
        if (sweepDocs.indexOf(doc) === -1) sweepDocs.push(doc);
        for (var di = 0; di < sweepDocs.length; di++) {
          var sweepDoc = sweepDocs[di];
          try {
            var elements = sweepDoc.querySelectorAll('.readany-translation');
            for (var i = 0; i < elements.length; i++) {
              elements[i].remove();
            }
            var style = sweepDoc.getElementById('readany-chapter-translation-style');
            if (style) style.remove();
            var tagged = sweepDoc.querySelectorAll('[data-translate-id]');
            for (var ti = 0; ti < tagged.length; ti++) {
              tagged[ti].removeAttribute('data-translate-id');
              tagged[ti].removeAttribute('data-original-hidden');
            }
          } catch (e) {}
        }
      } catch (err) {
        console.error('[WebView] Error removing translations:', err);
      }
    }

    function handleApplyChapterTranslationVisibility(originalVisible, translationVisible, sectionIndex) {
      try {
        var indexed = getRendererContentForSection(sectionIndex);
        var docs = [];
        var contents = getRendererContents();
        for (var ci = 0; ci < contents.length; ci++) {
          if (contents[ci] && contents[ci].doc) docs.push(contents[ci].doc);
        }
        var targets = [];
        if (indexed && indexed.doc) targets.push(indexed.doc);
        else if (docs.length) targets = docs.slice();
        else {
          var iframes = document.querySelectorAll('iframe');
          for (var fi = 0; fi < iframes.length; fi++) {
            try {
              var iframeDoc = iframes[fi].contentDocument || (iframes[fi].contentWindow && iframes[fi].contentWindow.document);
              if (iframeDoc && iframeDoc.body) { targets.push(iframeDoc); break; }
            } catch (e) {}
          }
        }
        var hiddenOriginal = String(!originalVisible);
        var hiddenTranslation = String(!translationVisible);
        var solo = String(!originalVisible && translationVisible);
        for (var di = 0; di < targets.length; di++) {
          try {
            var doc = targets[di];
            var origEls = doc.querySelectorAll('[data-translate-id]');
            for (var j = 0; j < origEls.length; j++) {
              origEls[j].setAttribute('data-original-hidden', hiddenOriginal);
            }
            var els = doc.querySelectorAll('.readany-translation');
            for (var i = 0; i < els.length; i++) {
              els[i].setAttribute('data-hidden', hiddenTranslation);
              els[i].setAttribute('data-solo', solo);
            }
          } catch (e) {}
        }
      } catch (err) {
        console.error('[WebView] Error applying translation visibility:', err);
      }
    }

    function isInsideRubyAnnotation(node) {
      var p = node.parentNode;
      while (p && p.nodeType === 1) {
        var name = p.tagName && p.tagName.toLowerCase();
        if (name === 'rt' || name === 'rp') return true;
        p = p.parentNode;
      }
      return false;
    }

    function getTextNodes(element) {
      const walker = element.ownerDocument.createTreeWalker(
        element,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function (node) {
            if (isInsideRubyAnnotation(node)) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          },
        }
      );
      const nodes = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.textContent && node.textContent.trim()) {
          nodes.push(node);
        }
      }
      return nodes;
    }

    function getTTSTextNodes(element) {
      const walker = element.ownerDocument.createTreeWalker(
        element,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function (node) {
            if (isInsideRubyAnnotation(node)) return NodeFilter.FILTER_REJECT;
            if (isTTSFootnoteMarker(node.nodeValue || '')) return NodeFilter.FILTER_REJECT;
            if (shouldSkipTTSNode(node.parentElement)) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          },
        }
      );
      const nodes = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.textContent && node.textContent.trim()) {
          nodes.push(node);
        }
      }
      return nodes;
    }

    function extractBlockText(block) {
      const walker = block.ownerDocument.createTreeWalker(
        block,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function (node) {
            if (isInsideRubyAnnotation(node)) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          },
        }
      );
      const texts = [];
      let node;
      while ((node = walker.nextNode())) {
        const text = node.textContent?.trim();
        if (text) texts.push(text);
      }
      return texts.join(" ");
    }

    // ─── Ruby Annotation (Pinyin/Zhuyin) ───
    var _rubyWordDict = null; // { "word": ["pinyin", freq] }
    var _rubyCharDict = null; // { "char": "pinyin" }
    var _rubyMode = null;     // "zh-pinyin" | "zh-zhuyin" | null

    var CJK_RE = /[一-鿿㐀-䶿豈-﫿]/;
    var RUBY_STYLE_ID = 'readany-ruby-style';
    var RUBY_PROCESSED_ATTR = 'data-ruby-processed';

    function rubyAnnotateChinese(text) {
      if ((!_rubyWordDict && !_rubyCharDict) || !text) return [{ char: text, reading: '', needsRuby: false }];
      var tokens = [];
      var i = 0;
      while (i < text.length) {
        var ch = text[i];
        if (!CJK_RE.test(ch)) {
          var j = i + 1;
          while (j < text.length && !CJK_RE.test(text[j])) j++;
          tokens.push({ char: text.slice(i, j), reading: '', needsRuby: false });
          i = j;
          continue;
        }
        var matched = false;
        if (_rubyWordDict) {
          for (var len = Math.min(4, text.length - i); len >= 2; len--) {
            var word = text.slice(i, i + len);
            var entry = _rubyWordDict[word];
            if (entry) {
              var reading = entry[0];
              var readings = reading.split(' ');
              if (readings.length === word.length) {
                for (var k = 0; k < word.length; k++) {
                  tokens.push({ char: word[k], reading: readings[k], needsRuby: true });
                }
              } else {
                tokens.push({ char: word, reading: reading, needsRuby: true });
              }
              i += len;
              matched = true;
              break;
            }
          }
        }
        if (matched) continue;
        var singleReading = '';
        if (_rubyWordDict && _rubyWordDict[ch]) {
          singleReading = _rubyWordDict[ch][0];
        } else if (_rubyCharDict && _rubyCharDict[ch]) {
          singleReading = _rubyCharDict[ch];
        }
        tokens.push({ char: ch, reading: singleReading, needsRuby: true });
        i++;
      }
      return tokens;
    }

    function rubyInjectStyles(doc) {
      if (doc.getElementById(RUBY_STYLE_ID)) return;
      var style = doc.createElement('style');
      style.id = RUBY_STYLE_ID;
      style.textContent = [
        '.readany-ruby rt { font-size: 0.5em; line-height: 1; color: var(--readany-ruby-color, #888); font-weight: normal; user-select: none; -webkit-user-select: none; }',
        '.readany-ruby { ruby-align: center; }',
        '.readany-ruby-container { ruby-position: over; -webkit-ruby-position: before; }'
      ].join('\n');
      if (doc.head) doc.head.appendChild(style);
    }

    function rubyShouldSkip(el) {
      if (el.closest && el.closest('.readany-translation')) return true;
      if (el.closest && el.closest('ruby')) return true;
      if (el.closest && el.closest('rt')) return true;
      if (el.closest && el.closest('[' + RUBY_PROCESSED_ATTR + ']')) return true;
      var tag = el.tagName && el.tagName.toLowerCase();
      if (tag === 'script' || tag === 'style') return true;
      return false;
    }

    function rubyExtractOriginalText(el) {
      var result = '';
      for (var ci = 0; ci < el.childNodes.length; ci++) {
        var child = el.childNodes[ci];
        if (child.nodeType === 3) { result += child.nodeValue || ''; }
        else if (child.nodeType === 1) {
          var tag = child.tagName && child.tagName.toLowerCase();
          if (tag === 'rt' || tag === 'rp') continue;
          result += rubyExtractOriginalText(child);
        }
      }
      return result;
    }

    function doInjectRubyAnnotations(doc, mode) {
      if (!mode || !doc) return 0;
      if (!_rubyWordDict && !_rubyCharDict) return 0;
      rubyInjectStyles(doc);
      var blocks = doc.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, blockquote, dd, dt, figcaption, div');
      var count = 0;
      for (var bi = 0; bi < blocks.length; bi++) {
        var block = blocks[bi];
        if (!block.textContent || !block.textContent.trim()) continue;
        if (rubyShouldSkip(block)) continue;
        if (block.querySelector && block.querySelector('[' + RUBY_PROCESSED_ATTR + ']')) continue;
        if (!CJK_RE.test(block.textContent)) continue;

        var walker = doc.createTreeWalker(block, NodeFilter.SHOW_TEXT, {
          acceptNode: function(node) {
            if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_SKIP;
            if (!CJK_RE.test(node.nodeValue)) return NodeFilter.FILTER_SKIP;
            var parent = node.parentElement;
            if (!parent) return NodeFilter.FILTER_ACCEPT;
            if (rubyShouldSkip(parent)) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        var textNodes = [];
        var tn = walker.nextNode();
        while (tn) { textNodes.push(tn); tn = walker.nextNode(); }

        for (var ti = 0; ti < textNodes.length; ti++) {
          var node = textNodes[ti];
          var text = node.nodeValue || '';
          if (!text.trim() || !CJK_RE.test(text)) continue;
          var tokens = rubyAnnotateChinese(text);
          var span = doc.createElement('span');
          span.setAttribute(RUBY_PROCESSED_ATTR, 'true');
          span.className = 'readany-ruby-container';
          for (var tki = 0; tki < tokens.length; tki++) {
            var token = tokens[tki];
            if (token.needsRuby && token.reading) {
              var ruby = doc.createElement('ruby');
              ruby.className = 'readany-ruby';
              ruby.textContent = token.char;
              var rt = doc.createElement('rt');
              rt.textContent = token.reading;
              ruby.appendChild(rt);
              span.appendChild(ruby);
            } else {
              span.appendChild(doc.createTextNode(token.char));
            }
          }
          if (node.parentNode) node.parentNode.replaceChild(span, node);
          count++;
        }
      }
      return count;
    }

    function doRemoveRubyAnnotations(doc) {
      if (!doc) return;
      var style = doc.getElementById(RUBY_STYLE_ID);
      if (style) style.remove();
      var processed = doc.querySelectorAll('[' + RUBY_PROCESSED_ATTR + ']');
      for (var i = 0; i < processed.length; i++) {
        var el = processed[i];
        var originalText = rubyExtractOriginalText(el);
        var textNode = doc.createTextNode(originalText);
        if (el.parentNode) el.parentNode.replaceChild(textNode, el);
      }
    }

    // Called from RN to set dict data
    window.setRubyDicts = function(wordDictJson, charDictJson) {
      try {
        _rubyWordDict = wordDictJson ? (typeof wordDictJson === 'string' ? JSON.parse(wordDictJson) : wordDictJson) : null;
        _rubyCharDict = charDictJson ? (typeof charDictJson === 'string' ? JSON.parse(charDictJson) : charDictJson) : null;
        return true;
      } catch(e) {
        console.error('[Ruby] Failed to parse dicts:', e);
        return false;
      }
    };

    // Called from RN to inject ruby on current page
    window.injectRuby = function(mode) {
      _rubyMode = mode || null;
      if (!_rubyMode) { window.removeRuby(); return; }
      var doc = null;
      if (view && view.renderer && view.renderer.getContents) {
        var contents = view.renderer.getContents();
        if (contents && contents.length && contents[0] && contents[0].doc) doc = contents[0].doc;
      }
      if (!doc) {
        var iframes = document.querySelectorAll('iframe');
        for (var fi = 0; fi < iframes.length; fi++) {
          try {
            var iframeDoc = iframes[fi].contentDocument || (iframes[fi].contentWindow && iframes[fi].contentWindow.document);
            if (iframeDoc && iframeDoc.body) { doc = iframeDoc; break; }
          } catch(e) {}
        }
      }
      if (doc) doInjectRubyAnnotations(doc, _rubyMode);
    };

    // Called from RN to remove ruby
    window.removeRuby = function() {
      _rubyMode = null;
      var doc = null;
      if (view && view.renderer && view.renderer.getContents) {
        var contents = view.renderer.getContents();
        if (contents && contents.length && contents[0] && contents[0].doc) doc = contents[0].doc;
      }
      if (!doc) {
        var iframes = document.querySelectorAll('iframe');
        for (var fi = 0; fi < iframes.length; fi++) {
          try {
            var iframeDoc = iframes[fi].contentDocument || (iframes[fi].contentWindow && iframes[fi].contentWindow.document);
            if (iframeDoc && iframeDoc.body) { doc = iframeDoc; break; }
          } catch(e) {}
        }
      }
      if (doc) doRemoveRubyAnnotations(doc);
    };
