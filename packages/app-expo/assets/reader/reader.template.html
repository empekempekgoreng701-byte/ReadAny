          applySettings(msg.settings);
        }

        if (el.isFixedLayout) {
          await el.init({});
        } else if (msg.lastLocation) {
          try {
            await el.init({ lastLocation: msg.lastLocation });
          } catch (err) {
            console.warn('[WebView] Failed to init with lastLocation, going to start:', err);
            await el.goToFraction(0);
          }
        } else {
          await el.goToFraction(0);
        }

        scheduleBookTextMetrics(book);

      } catch (err) {
        console.error('[WebView] Error in openBook:', err);
        const message = `${String(err)}${msg?.uri ? ` (${msg.uri})` : ''}`;
        loading.innerHTML = '<div class="error-text">' + escapeHtml(message) + '</div>';
        postToRN('error', { message });
      }
    }

    // ─── Search ───
    async function handleSearch(query) {
      if (!view || !query) return;
      searchResults = [];
      searchIndex = 0;

      try {
        const iter = view.search({ query });
        let totalResults = 0;
        for await (const result of iter) {
          if (result === 'done') break;
          if (result.subitems) {
            totalResults += result.subitems.length;
            for (const sub of result.subitems) {
              searchResults.push(sub);
            }
          } else if (result.cfi) {
            totalResults++;
            searchResults.push(result);
          }
          if (result.progress != null) {
            postToRN('searchProgress', { progress: result.progress });
          }
        }
        postToRN('searchComplete', { count: totalResults });
        // Navigate to first result
        if (searchResults.length > 0) {
          await view.goTo(searchResults[0].cfi);
          postToRN('searchResult', { index: 0, count: totalResults });
        }
      } catch (err) {
        postToRN('error', { message: 'Search failed: ' + String(err) });
      }
    }

    async function navigateToSearchResult(index) {
      if (index < 0 || index >= searchResults.length) return;
      searchIndex = index;
      try {
        await view.goTo(searchResults[index].cfi);
        postToRN('searchResult', { index, count: searchResults.length });
      } catch (err) {
        postToRN('error', { message: 'Navigate search failed: ' + String(err) });
      }
    }

    // ─── Fast whole-book search over cached plain text ───
    // Build once per book (chunked + cancellable, same pattern as
    // computeBookTextMetrics), then every query is a cheap string scan.
    async function ensureBookTextCache() {
      if (bookTextCacheReady && bookTextCache && bookTextCache.bookRef === currentBook) return true;
      const book = currentBook;
      if (!book || !book.sections || !book.sections.length) return false;
      // Reuse in-flight build if one is already running for this book
      if (bookTextCache === null && bookTextCacheBuildingFor === book) return false;
      const myJob = ++bookTextCacheJobId;
      bookTextCacheBuildingFor = book;
      const sections = [];
      const total = book.sections.length;
      try {
        for (let i = 0; i < total; i++) {
          if (myJob !== bookTextCacheJobId || currentBook !== book) return false;
          const section = book.sections[i];
          if (!section || !section.createDocument) continue;
          try {
            const doc = await section.createDocument();
            const blocks = collectSectionBlocks(doc);
            if (blocks.length > 0) {
              const joined = joinBlocks(blocks);
              sections.push({ index: i, text: joined.text, bounds: joined.bounds });
            }
          } catch (err) { /* skip unreadable section */ }
          if (i % 3 === 2) {
            postToRN('searchCacheProgress', { progress: (i + 1) / total });
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
        }
      } finally {
        if (bookTextCacheBuildingFor === book) bookTextCacheBuildingFor = null;
      }
      if (myJob !== bookTextCacheJobId || currentBook !== book) return false;
      bookTextCache = { bookRef: book, sections };
      bookTextCacheReady = true;
      postToRN('searchCacheProgress', { progress: 1 });
      // Retry a query that arrived while this build was running.
      try {
        if (pendingSearchQuery) {
          const parked = pendingSearchQuery;
          pendingSearchQuery = null;
          handleSearchFast(parked.query, parked.opts);
        }
      } catch (e) { /* retry is best-effort */ }
      return true;
    }

    // Collect raw block texts (NO whitespace normalization) so cached char
    // offsets map exactly onto live-DOM text nodes during navigation.
    function collectSectionBlocks(doc) {
      const blocks = [];
      if (!doc || !doc.querySelectorAll) return blocks;
      const els = doc.querySelectorAll(FAST_SEARCH_BLOCK_SELECTOR);
      for (let i = 0; i < els.length; i++) {
        const t = els[i].textContent || '';
        if (t.trim().length < 2) continue;
        blocks.push(t);
      }
      return blocks;
    }

    function joinBlocks(blocks) {
      const bounds = [];
      let text = '';
      for (let i = 0; i < blocks.length; i++) {
        bounds.push(text.length);
        text += blocks[i] + '\n';
      }
      return { text, bounds };
    }

    function isWordChar(ch) {
      return /[\p{L}\p{N}_]/u.test(ch);
    }

    function squashWhitespace(s) {
      return (s || '').replace(/\s+/g, ' ');
    }

    function makeMatchExcerpt(text, matchStart, matchLength) {
      const ctx = FAST_SEARCH_EXCERPT_CONTEXT;
      return {
        pre: squashWhitespace(text.slice(Math.max(0, matchStart - ctx), matchStart)),
        match: squashWhitespace(text.slice(matchStart, matchStart + matchLength)),
        post: squashWhitespace(text.slice(matchStart + matchLength, matchStart + matchLength + ctx)),
      };
    }

    function matchOptionsOf(opts) {
      const o = opts || {};
      const direction = o.direction === 'forward' || o.direction === 'backward' ? o.direction : 'all';
      return { matchCase: !!o.matchCase, wholeWord: !!o.wholeWord, direction };
    }

    function isWholeWordMatch(text, at, len) {
      const before = at > 0 ? text.charAt(at - 1) : '';
      const after = at + len < text.length ? text.charAt(at + len) : '';
      if (before && isWordChar(before)) return false;
      if (after && isWordChar(after)) return false;
      return true;
    }

    // Locate the block containing a cached char offset (both derived from the
    // same block list, so the mapping is exact).
    function locateBlock(bounds, offset) {
      let blockIndex = 0;
      for (let i = 0; i < bounds.length; i++) {
        if (bounds[i] <= offset) blockIndex = i;
        else break;
      }
      return { blockIndex, blockOffset: offset - bounds[blockIndex] };
    }

    // Query that arrived while the text index was still building; it is
    // retried automatically once the build finishes (instead of dying silent
    // and leaving the RN spinner stuck).
    let pendingSearchQuery = null;
    // CJK scripts have no word boundaries: whole-word matching on Han/Hangul/
    // Kana queries matches ~nothing, so it is bypassed for such queries
    // (shared core rule; local regex kept only as a fallback).
    async function handleSearchFast(query, opts) {
      const myToken = ++fastSearchToken;
      if (!view || !query) {
        postToRN('searchComplete', { count: 0 });
        return;
      }
      const { matchCase, wholeWord, direction } = matchOptionsOf(opts);
      const needle = matchCase ? query : query.toLocaleLowerCase();
      if (!needle) {
        postToRN('searchComplete', { count: 0 });
        return;
      }
      const cacheOk = await ensureBookTextCache();
      if (myToken !== fastSearchToken) return; // superseded by a newer query
      if (!cacheOk) {
        // Index still building (or book not ready): park this query for retry
        // when the build completes; report completion so no spinner sticks.
        pendingSearchQuery = { query, opts };
        postToRN('searchComplete', { count: 0 });
        return;
      }
      const wholeWordEff = window.ReadAnyTranslationText
        ? window.ReadAnyTranslationText.effectiveWholeWord(wholeWord, query)
        : (wholeWord && !/[㐀-䶿一-鿿豈-﫿぀-ヿ가-힯]/.test(query));
      const myCache = bookTextCache;
      // Direction filter is section-level (current section always included)
      const anchorSection = currentSectionIndex | 0;
      const results = [];
      let totalCount = 0;
      let truncated = false;
      for (const section of myCache.sections) {
        if (myToken !== fastSearchToken) return; // superseded by newer query
        if (direction === 'forward' && section.index < anchorSection) continue;
        if (direction === 'backward' && section.index > anchorSection) continue;
        const raw = section.text;
        const haystack = matchCase ? raw : raw.toLocaleLowerCase();
        let from = 0;
        let seen = 0;
        for (;;) {
          const at = haystack.indexOf(needle, from);
          if (at < 0) break;
          from = at + Math.max(1, needle.length);
          if (wholeWordEff && !isWholeWordMatch(raw, at, needle.length)) continue;
          totalCount++;
          if (results.length < FAST_SEARCH_MAX_RESULTS) {
            const loc = locateBlock(section.bounds, at);
            results.push({
              sectionIndex: section.index,
              blockIndex: loc.blockIndex,
              blockOffset: loc.blockOffset,
              excerpt: makeMatchExcerpt(raw, at, needle.length),
            });
          } else {
            truncated = true;
          }
          seen++;
          // Yield periodically so long scans don't block rendering
          if (seen % 200 === 0) await new Promise((resolve) => setTimeout(resolve, 0));
          if (myToken !== fastSearchToken) return;
        }
      }
      if (myToken !== fastSearchToken) return;
      postToRN('searchResultsList', { results, totalCount, truncated });
      postToRN('searchComplete', { count: totalCount });
    }

    // Navigate to one cached match by exact (block, offset) coordinates.
    // No second search pass needed; CFI is resolved via cfiForBlockOffset.
    async function goToCachedMatch(sectionIndex, blockIndex, blockOffset) {
      try {
        if (!view) return;
        const cfi = await cfiForBlockOffset(sectionIndex, blockIndex, blockOffset);
        if (!cfi) return;
        await view.goTo(cfi);
        try {
          if (window.flashHighlight) window.flashHighlight(cfi);
        } catch (e) { /* highlight is best-effort */ }
        postToRN('searchResult', { index: blockIndex | 0, count: 1 });
      } catch (err) {
        postToRN('error', { message: 'Navigate search failed: ' + String(err) });
      }
    }

    // ─── Auto-scroll ───
    // Scroll mode: rAF loop driving renderer.scrollBy (smooth, frame-paced).
    // Paginated mode: timer driving view.next() (page interval derived from
    // the same px/sec speed via viewport height).
    function isContinuousAutoScrollMode() {
      return currentViewMode === 'scroll' && view && !view.isFixedLayout;
    }

    function stopAutoScrollLoop() {
      if (autoScrollRafId) {
        try { cancelAnimationFrame(autoScrollRafId); } catch (e) {}
        autoScrollRafId = 0;
      }
      if (autoScrollPageTimer) {
        try { clearInterval(autoScrollPageTimer); } catch (e) {}
        autoScrollPageTimer = 0;
      }
    }

    function autoScrollFrame(t) {
      if (!autoScrollActive) return;
      const dt = Math.min(100, Math.max(0, t - autoScrollLastT));
      autoScrollLastT = t;
      try {
        const renderer = view && view.renderer;
        if (renderer && typeof renderer.scrollBy === 'function' && dt > 0) {
          const d = (autoScrollSpeedPxPerSec * dt) / 1000;
          if (currentSectionUsesVerticalWriting) renderer.scrollBy(-d, 0);
          else renderer.scrollBy(0, d);
        }
      } catch (e) {}
      // Stop at end of book: fraction pinned at max for N consecutive frames
      const f = lastAutoScrollFraction;
      if (f != null && f >= AUTO_SCROLL_END_FRACTION) {
        autoScrollEndStallTicks++;
        if (autoScrollEndStallTicks >= AUTO_SCROLL_END_STALL_TICKS) {
          setAutoScroll(false);
          return;
        }
      } else {
        autoScrollEndStallTicks = 0;
      }
      autoScrollRafId = requestAnimationFrame(autoScrollFrame);
    }

    function setAutoScroll(active, speedPxPerSec) {
      // Mutual exclusion with speed-read
      if (active && speedReadActive) {
        // Stop RSVP without restoring position (will be handled by RSVP exit)
        speedReadActive = false;
        stopSpeedReadLoop();
        postToRN('speedReadState', { active: false, wpm: speedReadWpm, chunkSize: speedReadChunk });
      }
      stopAutoScrollLoop();
      autoScrollActive = !!active;
      if (typeof speedPxPerSec === 'number' && speedPxPerSec > 0) {
        autoScrollSpeedPxPerSec = speedPxPerSec;
      }
      autoScrollEndStallTicks = 0;
      if (autoScrollActive && view) {
        if (isContinuousAutoScrollMode()) {
          autoScrollLastT = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
          autoScrollRafId = requestAnimationFrame(autoScrollFrame);
        } else {
          const h = (readerElement && readerElement.clientHeight) || window.innerHeight || 700;
          const interval = Math.min(20000, Math.max(1500, (h / autoScrollSpeedPxPerSec) * 1000));
          autoScrollPageTimer = setInterval(() => {
            try {
              if (!autoScrollActive || !view) return;
              // End-of-book: fraction pinned at max across consecutive ticks
              const f = lastAutoScrollFraction;
              if (f != null && f >= AUTO_SCROLL_END_FRACTION) {
                autoScrollEndStallTicks++;
                if (autoScrollEndStallTicks >= 3) {
                  setAutoScroll(false);
                  return;
                }
              } else {
                autoScrollEndStallTicks = 0;
              }
              view.next();
            } catch (e) {}
          }, interval);
        }
      } else {
        autoScrollActive = false;
      }
      postToRN('autoScrollState', { active: autoScrollActive, speedPxPerSec: autoScrollSpeedPxPerSec });
    }

    // ─── Speed-read RSVP (rapid serial visual presentation) ───
    // Flashes word chunks in a centered overlay. Word source is the current
    // section's blocks (same collector as fast search); exiting maps the
    // current word back to a CFI so the reading position is preserved.
    const SPEED_READ_DEFAULT_WPM = 300;
    const SPEED_READ_DEFAULT_CHUNK = 3;
    const SPEED_READ_MIN_WPM = 100;
    const SPEED_READ_MAX_WPM = 800;
    const SPEED_READ_MIN_CHUNK = 1;
    const SPEED_READ_MAX_CHUNK = 10;
    let speedReadActive = false;
    let speedReadWpm = SPEED_READ_DEFAULT_WPM;
    let speedReadChunk = SPEED_READ_DEFAULT_CHUNK;
    let speedReadAdvancing = false;
    let speedReadWords = []; // [{ text, blockIndex, blockOffset }]
    let speedReadSectionIndex = -1;
    let speedReadPos = 0;
    let speedReadTimer = 0;
    let speedReadOverlayEl = null;

    function splitBlockWords(blockText) {
      const out = [];
      const re = /\S+/g;
      let m = null;
      while ((m = re.exec(blockText)) !== null) {
        const token = m[0];
        // CJK runs without spaces: flash per character
        if (token.length > 1 && /[぀-ヿ㐀-䶿一-鿿豈-﫿]/.test(token)) {
          for (let i = 0; i < token.length; i++) {
            out.push({ text: token[i], offset: m.index + i });
          }
        } else {
          out.push({ text: token, offset: m.index });
        }
      }
      return out;
    }

    async function buildSpeedReadWords(sectionIndex) {
      const book = currentBook;
      if (!book || !book.sections) return false;
      const section = book.sections[sectionIndex];
      if (!section || !section.createDocument) return false;
      try {
        const doc = await section.createDocument();
        const els = doc.querySelectorAll(FAST_SEARCH_BLOCK_SELECTOR);
        const words = [];
        let bi = 0;
        for (let i = 0; i < els.length; i++) {
          const t = els[i].textContent || '';
          if (t.trim().length < 2) continue;
          const parts = splitBlockWords(t);
          for (const p of parts) {
            words.push({ text: p.text, blockIndex: bi, blockOffset: p.offset });
          }
          bi++;
        }
        if (!words.length) return false;
        speedReadWords = words;
        speedReadSectionIndex = sectionIndex;
        speedReadPos = 0;
        return true;
      } catch (e) {
        return false;
      }
    }

    function ensureSpeedReadOverlay() {
      if (speedReadOverlayEl) return speedReadOverlayEl;
      const container = document.getElementById('reader-container');
      if (!container) return null;
      const el = document.createElement('div');
      el.id = 'speedread-overlay';
      el.setAttribute('aria-hidden', 'true');
      el.style.cssText = 'position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);' +
        'z-index:90;display:none;max-width:86%;padding:18px 22px;border-radius:14px;' +
        'background:var(--bg,#1c1c1e);color:var(--fg,#e8e8ed);' +
        'border:1px solid rgba(127,127,127,0.35);box-shadow:0 12px 30px rgba(0,0,0,0.25);' +
        'font-size:30px;line-height:1.4;text-align:center;word-break:break-word;pointer-events:none;';
      const wordEl = document.createElement('div');
      wordEl.id = 'speedread-word';
      const progEl = document.createElement('div');
      progEl.id = 'speedread-progress';
      progEl.style.cssText = 'margin-top:10px;font-size:12px;opacity:0.65;';
      el.appendChild(wordEl);
      el.appendChild(progEl);
      container.appendChild(el);
      speedReadOverlayEl = el;
      return el;
    }

    function renderSpeedReadChunk() {
      const overlay = ensureSpeedReadOverlay();
      if (!overlay) return;
      const wordEl = overlay.querySelector('#speedread-word');
      const progEl = overlay.querySelector('#speedread-progress');
      const chunk = [];
      for (let i = 0; i < speedReadChunk && speedReadPos + i < speedReadWords.length; i++) {
        chunk.push(speedReadWords[speedReadPos + i].text);
      }
      if (wordEl) wordEl.textContent = chunk.join(' ');
      if (progEl) progEl.textContent = (speedReadPos + 1) + ' / ' + speedReadWords.length;
      overlay.style.display = 'block';
      postToRN('speedReadProgress', {
        index: Math.min(speedReadPos, Math.max(0, speedReadWords.length - 1)),
        total: speedReadWords.length,
        sectionIndex: speedReadSectionIndex,
      });
    }

    function speedReadTick() {
      if (!speedReadActive) return;
      if (speedReadPos >= speedReadWords.length) {
        advanceSpeedReadSection();
        return;
      }
      // Consume one chunk for timing, then render the NEXT chunk
      let count = 0;
      let sentenceEnd = false;
      while (count < speedReadChunk && speedReadPos + count < speedReadWords.length) {
        const w = speedReadWords[speedReadPos + count].text;
        count++;
        if (/[.!?…:;]$/.test(w)) sentenceEnd = true;
      }
      renderSpeedReadChunk();
      speedReadPos += count;
      const perWordMs = 60000 / Math.min(SPEED_READ_MAX_WPM, Math.max(SPEED_READ_MIN_WPM, speedReadWpm));
      const delay = Math.round(perWordMs * Math.max(1, count) * (sentenceEnd ? 1.5 : 1));
      speedReadTimer = setTimeout(speedReadTick, delay);
    }

    async function advanceSpeedReadSection() {
      const book = currentBook;
      const total = book && book.sections ? book.sections.length : 0;
      const next = speedReadSectionIndex + 1;
      // Stop at end of book, preserving position at last word
      if (next < 0 || next >= total) {
        await exitSpeedReadToPosition();
        setSpeedRead(false);
        return;
      }
      speedReadAdvancing = true;
      try {
        if (window.goToSection) await window.goToSection(next);
      } catch (e) {}
      // Give renderer a tick to fire relocate before clearing flag
      await new Promise((r) => setTimeout(r, 120));
      speedReadAdvancing = false;
      const ok = await buildSpeedReadWords(next);
      if (!ok || !speedReadActive) {
        if (speedReadActive) await exitSpeedReadToPosition();
        setSpeedRead(false);
        return;
      }
      speedReadTick();
    }

    function stopSpeedReadLoop() {
      if (speedReadTimer) {
        try { clearTimeout(speedReadTimer); } catch (e) {}
        speedReadTimer = 0;
      }
      if (speedReadOverlayEl) {
        try { speedReadOverlayEl.style.display = 'none'; } catch (e) {}
      }
    }

    async function exitSpeedReadToPosition() {
      try {
        const w = speedReadWords[Math.min(Math.max(0, speedReadPos - 1), Math.max(0, speedReadWords.length - 1))];
        if (!w || !view || typeof view.getCFI !== 'function') return;
        const cfi = await cfiForBlockOffset(speedReadSectionIndex, w.blockIndex, w.blockOffset);
        if (cfi) await view.goTo(cfi);
      } catch (e) {}
    }

    // Shared helper: CFI for exact (section, block, offset) coordinates.
    // Used by fast-search navigation and speed-read exit alike.
    async function cfiForBlockOffset(sectionIndex, blockIndex, blockOffset) {
      const book = currentBook;
      if (!view || typeof view.getCFI !== 'function' || !book || !book.sections) return null;
      const section = book.sections[sectionIndex];
      if (!section || !section.createDocument) return null;
      try {
        const doc = await section.createDocument();
        const els = doc.querySelectorAll(FAST_SEARCH_BLOCK_SELECTOR);
        const nonEmpty = [];
        for (let i = 0; i < els.length; i++) {
          const t = els[i].textContent || '';
          if (t.trim().length >= 2) nonEmpty.push(els[i]);
        }
        if (!nonEmpty.length) return null;
        const el = nonEmpty[Math.min(Math.max(0, blockIndex | 0), nonEmpty.length - 1)];
        let remaining = Math.max(0, blockOffset | 0);
        const walker = doc.createTreeWalker(el, 4 /* NodeFilter.SHOW_TEXT */);
        let node = walker.nextNode();
        let targetNode = null;
        let targetOffset = 0;
        while (node) {
          const len = (node.nodeValue || '').length;
          if (remaining <= len) {
            targetNode = node;
            targetOffset = remaining;
            break;
          }
          remaining -= len;
          node = walker.nextNode();
        }
        let range;
        if (targetNode && targetNode.nodeType === 3) {
          range = doc.createRange();
          range.setStart(targetNode, Math.min(targetOffset, (targetNode.nodeValue || '').length));
          range.collapse(true);
        } else {
          range = doc.createRange();
          range.selectNodeContents(el);
          range.collapse(true);
        }
        return view.getCFI(sectionIndex, range) || null;
      } catch (e) {
        return null;
      }
    }

    // ─── Phase 7: image gallery ───
    // Collect <img> per section with CFI lokasi (lazy + chunked, cancellable).
    // src blob URL valid di WebView saat koleksi; RN pakai untuk thumbnail.
    // Phase 11 §3: gallery item cap — metadata per item is small but
    // unbounded growth still hurts (komik 5000+ gambar). Items beyond the
    // cap are counted but not stored; tap-to-view still works via CFI.
    const IMAGE_GALLERY_MAX_ITEMS = 2000;
    async function ensureImageGallery() {
      if (imageGalleryReady && imageGalleryItems.length >= 0) return true;
      const book = currentBook;
      if (!book || !book.sections || !book.sections.length) return false;
      const myJob = ++imageGalleryJobId;
      const items = [];
      let totalImages = 0;
      let truncated = false;
      const total = book.sections.length;
      try {
        for (let i = 0; i < total; i++) {
          if (myJob !== imageGalleryJobId || currentBook !== book) return false;
          const section = book.sections[i];
          if (!section || !section.createDocument) continue;
          try {
            const doc = await docWithTimeout(section.createDocument(), IMAGE_DOC_TIMEOUT_MS);
            const imgs = doc.querySelectorAll('img');
            for (let j = 0; j < imgs.length; j++) {
              const img = imgs[j];
              const src = img.currentSrc || img.src || '';
              if (!src) continue;
              const w = img.naturalWidth || Number(img.getAttribute('width')) || 0;
              const h = img.naturalHeight || Number(img.getAttribute('height')) || 0;
              // Skip tiny icons/decorations
              if (w > 0 && h > 0 && (w < 48 || h < 48)) continue;
              totalImages++;
              if (items.length >= IMAGE_GALLERY_MAX_ITEMS) {
                truncated = true;
                continue;
              }
              let cfi = null;
              try {
                const range = doc.createRange();
                range.selectNode(img);
                range.collapse(true);
                cfi = view && view.getCFI ? view.getCFI(i, range) : null;
              } catch (e) { /* CFI best-effort */ }
              items.push({
                sectionIndex: i,
                imgIndex: j, // raw DOM index in this section (for requestImageData)
                src,
                alt: (img.getAttribute('alt') || '').slice(0, 120),
                width: w,
                height: h,
                cfi,
              });
            }
          } catch (err) { /* skip unreadable/timed-out section */ }
          if (i % 3 === 2) {
            postToRN('imageGalleryProgress', { progress: (i + 1) / total });
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
        }
      } catch (e) {
        // Terminal failure: tell RN so the spinner can clear and retry later.
        try { postToRN('imageGalleryError', { message: String((e && e.message) || e) }); } catch (_) {}
        return false;
      }
      if (myJob !== imageGalleryJobId || currentBook !== book) return false;
      imageGalleryItems = items;
      imageGalleryReady = true;
      postToRN('imageGallery', { items, totalCount: totalImages, truncated });
      return true;
    }

    function invalidateImageGallery() {
      imageGalleryJobId += 1;
      imageGalleryItems = [];
      imageGalleryReady = false;
    }

    // Kirim data gambar (thumbnail/full) sebagai dataURL ke RN.
    // Blob URL WebView tidak bisa dibaca RN Image, jadi render via canvas.
    // Concurrency bound: canvas drawImage/toDataURL are synchronous main-thread
    // work — serialize to at most 2 concurrent encodes so 100+ image books
    // cannot spike CPU/memory with parallel full-res encodes. Queued requests
    // always resolve (same error posts as the direct path).
    const IMAGE_DATA_MAX_CONCURRENT = 2;
    let imageDataRunning = 0;
    const imageDataWaiters = [];
    function requestImageData(sectionIndex, docImgIndex, maxDim) {
      return new Promise(function (resolve) {
        // Generation tag: invalidateImageGallery() bumps imageGalleryJobId on
        // book change, so queued requests for the old book are dropped instead
        // of decoding the wrong book's images.
        imageDataWaiters.push({ sectionIndex, docImgIndex, maxDim, resolve, job: imageGalleryJobId });
        pumpImageDataQueue();
      });
    }
    function pumpImageDataQueue() {
      if (imageDataRunning >= IMAGE_DATA_MAX_CONCURRENT) return;
      var next = imageDataWaiters.shift();
      if (!next) return;
      if (next.job !== imageGalleryJobId) {
        try { next.resolve(); } catch (e) {}
        pumpImageDataQueue();
        return;
      }
      imageDataRunning += 1;
      requestImageDataInner(next.sectionIndex, next.docImgIndex, next.maxDim)
        .catch(function () {})
        .finally(function () {
          imageDataRunning -= 1;
          next.resolve();
          pumpImageDataQueue();
        });
    }
    async function requestImageDataInner(sectionIndex, docImgIndex, maxDim) {
      const si = Number(sectionIndex);
      const di = Number(docImgIndex);
      const maxSide = Math.max(48, Math.min(2000, Number(maxDim) || 240));
      try {
        const book = currentBook;
        if (!book || !book.sections || !book.sections[si] || !book.sections[si].createDocument) {
          postToRN('imageData', { sectionIndex: si, imgIndex: di, error: 'no-section' });
          return;
        }
        const doc = await docWithTimeout(book.sections[si].createDocument(), IMAGE_DOC_TIMEOUT_MS);
        const imgs = doc.querySelectorAll('img');
        const img = imgs[di];
        if (!img) {
          postToRN('imageData', { sectionIndex: si, imgIndex: di, error: 'no-img' });
          return;
        }
        // Tunggu gambar selesai load (maks 4 detik)
        if (!img.complete || (img.naturalWidth || 0) === 0) {
          await new Promise((resolve) => {
            const done = () => resolve();
            const to = setTimeout(done, 4000);
            img.addEventListener('load', () => { clearTimeout(to); done(); }, { once: true });
            img.addEventListener('error', () => { clearTimeout(to); done(); }, { once: true });
          });
        }
        const src = img.currentSrc || img.src || '';
        const natW = img.naturalWidth || 0;
        const natH = img.naturalHeight || 0;
        if (!natW || !natH) {
          // Fallback: kirim src apa adanya (misal data: URL)
          postToRN('imageData', { sectionIndex: si, imgIndex: di, dataUrl: src, width: 0, height: 0 });
          return;
        }
        const scale = Math.min(1, maxSide / Math.max(natW, natH));
        const cw = Math.max(1, Math.round(natW * scale));
        const ch = Math.max(1, Math.round(natH * scale));
        const canvas = document.createElement('canvas');
        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        let dataUrl = '';
        try {
          dataUrl = canvas.toDataURL('image/jpeg', 0.72);
        } catch (e) {
          dataUrl = src;
        }
        postToRN('imageData', { sectionIndex: si, imgIndex: di, dataUrl, width: natW, height: natH });
      } catch (err) {
        postToRN('imageData', { sectionIndex: si, imgIndex: di, error: String(err) });
      }
    }

    // Lompat ke lokasi gambar: pakai CFI yang sudah dikoleksi, fallback
    // ke awal section bila CFI tidak tersedia.
    async function goToImageLocation(sectionIndex, imgIndex) {
      try {
        const item = imageGalleryItems.find(
          (it) => it.sectionIndex === sectionIndex && it.imgIndex === imgIndex,
        );
        if (item && item.cfi && view) {
          await view.goTo(item.cfi);
          return;
        }
        if (view && sectionIndex != null) {
          try {
            if (window.goToSection) await window.goToSection(sectionIndex);
          } catch (e) {}
        }
      } catch (err) {
        postToRN('error', { message: 'Go to image failed: ' + String(err) });
      }
    }

    async function setSpeedRead(active, wpm, chunkSize) {
      if (active && autoScrollActive) {
        stopAutoScrollLoop();
        autoScrollActive = false;
        postToRN('autoScrollState', { active: false, speedPxPerSec: autoScrollSpeedPxPerSec });
      }
      stopSpeedReadLoop();
      speedReadActive = !!active;
      if (typeof wpm === 'number' && wpm > 0) {
        speedReadWpm = Math.min(SPEED_READ_MAX_WPM, Math.max(SPEED_READ_MIN_WPM, Math.round(wpm)));
      }
      if (typeof chunkSize === 'number' && chunkSize > 0) {
        speedReadChunk = Math.min(SPEED_READ_MAX_CHUNK, Math.max(SPEED_READ_MIN_CHUNK, Math.round(chunkSize)));
      }
      if (speedReadActive) {
        if (!view || currentSectionIndex == null) {
          speedReadActive = false;
        } else {
          const ok = await buildSpeedReadWords(currentSectionIndex);
          if (!ok) {
            speedReadActive = false;
          } else {
            speedReadTick();
          }
        }
      } else {
        await exitSpeedReadToPosition();
      }
      postToRN('speedReadState', {
        active: speedReadActive,
        wpm: speedReadWpm,
        chunkSize: speedReadChunk,
      });
    }

    // ─── Phase 2: brightness / eye-care / reading ruler / background ───
    function setBrightnessValue(v) {
      brightnessValue = Math.max(0, Math.min(100, Number(v) || 100));
      const el = document.getElementById('brightness-overlay');
      if (!el) return;
      const opacity = (100 - brightnessValue) / 100 * 0.72;
      el.style.display = opacity > 0.01 ? 'block' : 'none';
      el.style.opacity = String(opacity);
    }
    function setEyeCare(active) {
      eyeCareActive = !!active;
      const el = document.getElementById('eyecare-overlay');
      if (!el) return;
      el.style.display = eyeCareActive ? 'block' : 'none';
    }
    function setBackgroundPreset(preset) {
      backgroundPreset = preset || 'default';
      document.body.classList.remove('bg-sepia', 'bg-paper', 'bg-night');
      if (backgroundPreset === 'sepia') document.body.classList.add('bg-sepia');
      else if (backgroundPreset === 'paper') document.body.classList.add('bg-paper');
      else if (backgroundPreset === 'night') document.body.classList.add('bg-night');
    }
    let rulerTouchHandlerAttached = false;
    function ensureRulerTouchHandler() {
      if (rulerTouchHandlerAttached) return;
      rulerTouchHandlerAttached = true;
      const container = document.getElementById('reader-container');
      if (!container) return;
      const onMove = (e) => {
        if (!rulerActive) return;
        const ruler = document.getElementById('reading-ruler');
        if (!ruler || !ruler.style.display || ruler.style.display === 'none') return;
        const t = e.touches && e.touches[0] ? e.touches[0] : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : null);
        if (!t) return;
        const rect = container.getBoundingClientRect();
        const y = Math.max(0, Math.min(rect.height - 2, t.clientY - rect.top));
        ruler.style.top = y + 'px';
      };
      container.addEventListener('touchmove', onMove, { passive: true });
      container.addEventListener('touchstart', onMove, { passive: true });
    }
    function setReadingRuler(active) {
      rulerActive = !!active;
      ensureRulerTouchHandler();
      const el = document.getElementById('reading-ruler');
      if (!el) return;
      el.style.display = rulerActive ? 'block' : 'none';
      if (rulerActive) {
        const c = document.getElementById('reader-container');
        const h = c ? c.clientHeight : window.innerHeight;
        el.style.top = Math.round(h / 2) + 'px';
      }
    }

    // ─── Settings ───
    function applySettings(settings) {
      if (!view || !view.renderer) return;
      const renderer = view.renderer;
      if (settings.justifyBodyText !== undefined) {
        currentJustifyBodyText = settings.justifyBodyText !== false;
      }
      if (settings.smoothReading !== undefined) {
        currentSmoothReading = settings.smoothReading === true;
        syncSmoothReadingAttribute(renderer);
      }
      // PDF pages are fixed-layout canvases. Reader font, line-height, custom
      // font and paragraph-spacing rules would move the transparent text layer
      // away from the canvas and render a second, misaligned copy of the text.
      if (currentBookIsPdf) {
        if (settings.paginatedLayout !== undefined) {
          currentPaginatedLayout =
            settings.paginatedLayout === 'single' ? 'single' : 'double';
        }
        if (view.isFixedLayout) {
          applyFixedLayoutRendererSettings(renderer, currentPaginatedLayout);
        }
        return;
      }

      // Update custom font state
      if (settings.customFontFaceCSS !== undefined) {
        currentCustomFontFaceCSS = settings.customFontFaceCSS || '';
        injectCustomFontFace(currentCustomFontFaceCSS);
      }
      if (settings.customFontFamily !== undefined) {
        currentCustomFontFamily = settings.customFontFamily || '';
      }
      if (settings.useBookFonts !== undefined) {
        currentUseBookFonts = settings.useBookFonts !== false;
      }

      if (settings.fontSize !== undefined) {
        currentFontSize = settings.fontSize;
      }
      if (settings.lineHeight !== undefined) {
        currentLineHeight = settings.lineHeight;
      }
      if (settings.paragraphSpacing !== undefined) {
        currentParagraphSpacing = settings.paragraphSpacing;
      }
      if (settings.fontTheme !== undefined) {
        currentFontTheme = settings.fontTheme || 'default';
      }
      if (settings.paginatedLayout !== undefined) {
        currentPaginatedLayout =
          settings.paginatedLayout === 'single' ? 'single' : 'double';
      }

      if (settings.fontSize !== undefined || settings.lineHeight !== undefined || settings.fontTheme !== undefined || settings.paragraphSpacing !== undefined || settings.justifyBodyText !== undefined
          || settings.customFontFamily !== undefined || settings.customFontFaceCSS !== undefined || settings.useBookFonts !== undefined) {
        const fontThemes = {
          default: { cjk: '-apple-system, BlinkMacSystemFont, system-ui, sans-serif', serif: '-apple-system, BlinkMacSystemFont, system-ui, sans-serif' },
          system: { cjk: '-apple-system, BlinkMacSystemFont, system-ui, sans-serif', serif: '-apple-system, BlinkMacSystemFont, system-ui, sans-serif' },
          literata: { cjk: "'Noto Serif SC', 'Source Han Serif SC', serif", serif: "Literata, Georgia, serif" },
        };

        let fontFamily;
        if (currentCustomFontFamily) {
          fontFamily = cssString(currentCustomFontFamily);
        } else {
          const theme = fontThemes[currentFontTheme] || fontThemes.default;
          // For themes with multi-value font stacks (like system default), use as-is
          // For named font themes (like literata), wrap in quotes
          const needsQuotes = !theme.cjk.includes(',');
          if (needsQuotes) {
            fontFamily = "'" + theme.cjk + "', '" + theme.serif + "', serif";
          } else {
            fontFamily = theme.cjk;
          }
        }
        const fSize = currentFontSize;
        const lh = currentLineHeight;
        // paragraphSpacing/pageMargin are stored as px tuned at the
        // default 16px font size. Scale them with the actual font size so
        // spacing reads proportionally at large font sizes — without this
        // a 16px paragraphSpacing looks cramped at fontSize 64.
        // BASELINE matches defaultReadSettings.fontSize in core/stores/settings-store.ts.
        const BASELINE_FONT_SIZE = 16;
        const layoutScale = currentFontSize / BASELINE_FONT_SIZE;
        const ps = Math.round(currentParagraphSpacing * layoutScale);

        // When useBookFonts is enabled (default), do not force the reader
        // font family onto every element so the book's own fonts (e.g.
        // embedded @font-face families) render where the book specifies them.
        const bodyStarFontOverride = currentUseBookFonts
          ? ''
          : `:root:not(.vrtl):not(.vltr) body *:not(svg):not(svg *):not(math):not(math *):not(pre):not(pre *):not(code):not(code *):not(kbd):not(kbd *):not(samp):not(samp *) {
  font-family: var(--readany-font-family) !important;
}`;

        const baseStyles = `
          :root {
            --readany-font-family: ${fontFamily};
          }
          :root:not(.vrtl):not(.vltr),
          :root:not(.vrtl):not(.vltr) body {
            font-family: var(--readany-font-family) !important;
            font-size: ${fSize}px !important;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
          }
          ${bodyStarFontOverride}
          :root:not(.vrtl):not(.vltr) body *:not(svg):not(svg *):not(math):not(math *):not(pre):not(pre *):not(code):not(code *):not(kbd):not(kbd *):not(samp):not(samp *):not(rt):not(rp) {
            font-size: ${fSize}px !important;
          }
          :root:is(.vrtl, .vltr),
          :root:is(.vrtl, .vltr) body {
            font-family: var(--readany-font-family);
            font-size: ${fSize}px;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
          }
          :root:not(.vrtl):not(.vltr) p,
          :root:not(.vrtl):not(.vltr) div,
          :root:not(.vrtl):not(.vltr) blockquote,
          :root:not(.vrtl):not(.vltr) dd,
          :root:not(.vrtl):not(.vltr) li,
          :root:not(.vrtl):not(.vltr) span {
            font-size: ${fSize}px !important;
          }
          :root:not(.vrtl):not(.vltr) p,
          :root:not(.vrtl):not(.vltr) div,
          :root:not(.vrtl):not(.vltr) blockquote,
          :root:not(.vrtl):not(.vltr) dd,
          :root:not(.vrtl):not(.vltr) li,
          :root:not(.vrtl):not(.vltr) span,
          :root:not(.vrtl):not(.vltr) h1,
          :root:not(.vrtl):not(.vltr) h2,
          :root:not(.vrtl):not(.vltr) h3,
          :root:not(.vrtl):not(.vltr) h4,
          :root:not(.vrtl):not(.vltr) h5,
          :root:not(.vrtl):not(.vltr) h6 {
            line-height: ${lh} !important;
          }
          pre, code, kbd, samp {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
          }
          :root:not(.vrtl):not(.vltr) p {
            margin-top: ${ps}px !important;
            margin-bottom: ${ps}px !important;
          }
          :root:not(.vrtl):not(.vltr) img,
          :root:not(.vrtl):not(.vltr) svg {
            max-width: 100% !important;
          }
          img,
          svg {
            height: auto;
          }
          ${getVerticalWritingCompatibilityStyles()}
          ${currentJustifyBodyText !== false ? (globalThis.ReadAnyJustifiedText?.getJustifyCss?.() ?? globalThis.ReadAnyJustifiedText?.JUSTIFY_CSS ?? '') : ''}
        `;
        lastRendererStyles = baseStyles;
        const themedStyles = injectThemeIntoStyles(
          baseStyles,
          currentThemeColors.bg,
          currentThemeColors.fg,
          currentThemeColors.primary,
        );

        // justify stylesheet, so getComputedStyle reflects the book's own CSS.
        syncJustifiedTextForAllDocs();
        if (typeof renderer.setStyles === 'function') {
          renderer.setStyles(themedStyles);
        }
        syncReaderOverrideStylesForAllDocs(themedStyles);
        syncCustomFontStylesForAllDocs(currentCustomFontFaceCSS);
      }

      if (settings.pageMargin != null) {
        // Scale pageMargin with fontSize so the page edges stay
        // proportionally placed at large font sizes. Same baseline (16) as
        // the paragraphSpacing scaling above.
        const BASELINE_FONT_SIZE = 16;
        const layoutScale = currentFontSize / BASELINE_FONT_SIZE;
        const margin = Math.round(settings.pageMargin * layoutScale);
        applyMobileReflowMargins(renderer, margin);
      }

      if (view && view.isFixedLayout) {
        applyFixedLayoutRendererSettings(renderer, currentPaginatedLayout);
      }

      if (settings.viewMode) {
        currentViewMode = settings.viewMode;
        applyRendererFlowMode(renderer);
      }
    }

    function getScrollNavigationDistance() {
      if (!view || !view.renderer) return Math.max(1, window.innerHeight - 96);
      const size = Number(view.renderer.size || 0);
      const fallbackSize = window.innerHeight || document.documentElement.clientHeight || 720;
      return Math.max(1, (Number.isFinite(size) && size > 0 ? size : fallbackSize) - 96);
    }

    function readerNavDebug(event, detail) {
      try {
        postToRN('debug', {
          message: `[ReaderNav] ${Date.now()} ${event} ${JSON.stringify(detail || {})}`,
        });
      } catch {}
    }

    async function goNextByMode(distance, source) {
      if (!view) return;
      const detail = {
        source: source || 'unknown',
        mode: view.renderer && view.renderer.scrolled ? 'scroll' : 'paginated',
        section: currentSectionIndex,
        navigationLocked: !!(view.renderer && view.renderer.navigationLocked),
      };
      readerNavDebug('next:start', detail);
      try {
        if (view.renderer && view.renderer.scrolled) {
          await view.next(Math.max(1, Number(distance || getScrollNavigationDistance())));
        } else {
          await view.next();
        }
        readerNavDebug('next:done', detail);
      } catch (error) {
        readerNavDebug('next:error', { ...detail, error: String(error) });
        throw error;
      }
    }

    async function goPrevByMode(distance, source) {
      if (!view) return;
      const detail = {
        source: source || 'unknown',
        mode: view.renderer && view.renderer.scrolled ? 'scroll' : 'paginated',
        section: currentSectionIndex,
        navigationLocked: !!(view.renderer && view.renderer.navigationLocked),
      };
      readerNavDebug('prev:start', detail);
      try {
        if (view.renderer && view.renderer.scrolled) {
          await view.prev(Math.max(1, Number(distance || getScrollNavigationDistance())));
        } else {
          await view.prev();
        }
        readerNavDebug('prev:done', detail);
      } catch (error) {
        readerNavDebug('prev:error', { ...detail, error: String(error) });
        throw error;
      }
    }

    function splitCustomFontCSS(css) {
      const importUrls = [];
      const fontFaceLines = [];
      for (const line of (css || '').split('\n')) {
        const trimmed = line.trim();
        if (trimmed.startsWith('@import')) {
          const url = trimmed
            .replace(/^@import\s+url\(['"]?/, '')
            .replace(/['"]?\);?\s*$/, '')
            .trim();
          if (url) importUrls.push(url);
        } else {
          fontFaceLines.push(line);
        }
      }
      return {
        importUrls,
        fontFaceCSS: fontFaceLines.join('\n').trim(),
      };
    }

    function cssString(value) {
      return JSON.stringify(String(value || ''));
    }

    function syncCustomFontStylesForDoc(doc, css) {
      if (!doc || !doc.head) return;
      const { importUrls, fontFaceCSS } = splitCustomFontCSS(css);

      doc.querySelectorAll('link.__readany_css_font__').forEach((el) => el.remove());
      for (const url of importUrls) {
        const link = doc.createElement('link');
        link.rel = 'stylesheet';
        link.href = url;
        link.className = '__readany_css_font__';
        doc.head.appendChild(link);
      }

      const styleId = '__readany_custom_font_face__';
      let el = doc.getElementById(styleId);
      if (!el) {
        el = doc.createElement('style');
        el.id = styleId;
        doc.head.appendChild(el);
      }
      el.textContent = fontFaceCSS;
    }

    function syncCustomFontStylesForAllDocs(css) {
      for (const content of getRendererContents()) {
        if (!content || !content.doc) continue;
        syncCustomFontStylesForDoc(content.doc, css);
      }
    }

    function syncReaderOverrideStylesForDoc(doc, css) {
      if (!doc || !doc.head) return;
      const styleId = '__readany_reader_overrides__';
      let el = doc.getElementById(styleId);
      if (!el) {
        el = doc.createElement('style');
        el.id = styleId;
        doc.head.appendChild(el);
      }
      el.textContent = css || '';
      // Keep this style after book styles and our @font-face block so it wins
      // against EPUBs that define fixed font sizes with !important.
      doc.head.appendChild(el);
    }

    function syncReaderOverrideStylesForAllDocs(css) {
      for (const content of getRendererContents()) {
        if (!content || !content.doc) continue;
        syncReaderOverrideStylesForDoc(content.doc, css);
      }
    }

    function syncJustifiedTextForAllDocs() {
      const fixedLayout = Boolean(view?.isFixedLayout);
      for (const content of getRendererContents()) {
        if (!content?.doc) continue;
        const unsupportedLayout = fixedLayout || isVerticalDoc(content.doc);
        globalThis.ReadAnyJustifiedText?.apply(
          content.doc,
          currentJustifyBodyText,
          unsupportedLayout,
        );
      }
    }

    function injectCustomFontFace(css) {
      syncCustomFontStylesForDoc(document, css);
      syncCustomFontStylesForAllDocs(css);
    }

    function setThemeColors(colors, themeMode) {
      const bg = colors.background || '#1c1c1e';
      const fg = colors.foreground || '#e8e8ed';
      const muted = colors.muted || '#7c7c82';
      const primary = colors.primary || '#3b82f6';

      currentThemeColors = { bg, fg, muted, primary };
      if (themeMode === 'dark' || themeMode === 'oled' || themeMode === 'sepia') {
        currentThemeMode = themeMode;
      } else {
        currentThemeMode = 'light';
      }

      document.documentElement.style.setProperty('--bg', bg);
      document.documentElement.style.setProperty('--fg', fg);
      document.documentElement.style.setProperty('--muted', muted);
      document.documentElement.style.setProperty('--primary', primary);
      document.body.style.backgroundColor = bg;
      document.body.style.color = fg;

      if (view && view.renderer && view.renderer.setStyles) {
        if (currentBookIsPdf) {
          view.renderer.setStyles(`
            html, body { background-color: ${bg} !important; }
            .textLayer span, .textLayer br { color: transparent !important; }
          `);
        } else {
          const currentStyles = lastRendererStyles || '';
          const themedStyles = injectThemeIntoStyles(currentStyles, bg, fg, primary);
          view.renderer.setStyles(themedStyles);
          syncReaderOverrideStylesForAllDocs(themedStyles);
        }
      }

      if (view && view.setSearchIndicator) {
        view.setSearchIndicator('outline', { color: primary });
      }

      reapplyPdfThemeFilters();
    }

    // ─── PDF theme inversion (dark/sepia) with per-page smart skip ───
    var PDF_THEME_FILTERS = {
      // Mobile dark theme uses #1c1c1e. Mapping white with invert(0.89)
      // produces approximately #1c1c1c, avoiding a visible page/shell seam.
      dark: 'invert(0.89)',
      // OLED maps white PDF paper to true black while preserving the dark-page smart skip.
      oled: 'invert(1)',
      // Numerically tuned (invert->sepia->contrast->brightness) so a white PDF
      // page maps almost exactly to the sepia background #f0e6d2 (rgb 240,230,210).
      sepia: 'invert(0.245) sepia(0.286) contrast(1.328) brightness(1.005)',
    };
    var pdfPageLightCache = {};
    var pdfDocIndexMap = new WeakMap();

    function analyzeCanvasIsLight(canvas) {
      var size = 48;
      var out = document.createElement('canvas');
      out.width = size;
      out.height = size;
      var ctx = out.getContext('2d', { willReadFrequently: true });
      if (!ctx) return true;
      try {
        ctx.drawImage(canvas, 0, 0, size, size);
        var data = ctx.getImageData(0, 0, size, size).data;
        var light = 0;
        for (var i = 0; i < data.length; i += 4) {
          var lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          if (lum > 200) light++;
        }
        // A text page is predominantly light; downsampling washes thin text
        // into gray, so only rely on how much of the page is clearly light.
        return light / (size * size) > 0.55;
      } catch (e) {
        return true;
      }
    }

    function waitForPdfPageCanvas(doc, timeoutMs) {
      timeoutMs = timeoutMs || 5000;
      return new Promise(function (resolve) {
        var win = doc.defaultView || window;
        var raf = typeof win.requestAnimationFrame === 'function'
          ? win.requestAnimationFrame.bind(win)
          : function (cb) { setTimeout(function () { cb(performance.now()); }, 50); };
        var start = performance.now();
        var check = function () {
          var canvas = doc.querySelector('#canvas canvas');
          if (canvas && canvas.width > 0 && canvas.height > 0) { resolve(canvas); return; }
          if (performance.now() - start > timeoutMs) { resolve(null); return; }
          raf(check);
        };
        check();
      });
    }

    function applyPdfPageThemeFilter(doc, index) {
      var filter = PDF_THEME_FILTERS[currentThemeMode];
      var iframe = doc.defaultView ? doc.defaultView.frameElement : null;
      if (!iframe) return;
      iframe.style.filter = '';
      iframe.style.backgroundColor = currentThemeColors.bg;
      doc.documentElement.style.backgroundColor = currentThemeColors.bg;
      if (doc.body) doc.body.style.backgroundColor = currentThemeColors.bg;
      if (!filter) {
        doc.documentElement.style.setProperty('--readany-pdf-filter', 'none');
        return;
      }
      var isLight = pdfPageLightCache[index];
      if (isLight === undefined) {
        waitForPdfPageCanvas(doc).then(function (canvas) {
          var light = canvas ? analyzeCanvasIsLight(canvas) : true;
          pdfPageLightCache[index] = light;
          doc.documentElement.style.setProperty('--readany-pdf-filter', light ? filter : 'none');
        });
        return;
      }
      doc.documentElement.style.setProperty('--readany-pdf-filter', isLight ? filter : 'none');
    }

    function reapplyPdfThemeFilters() {
      if (!currentBookIsPdf) return;
      var filter = PDF_THEME_FILTERS[currentThemeMode];
      var contents = getRendererContents();
      for (var i = 0; i < contents.length; i++) {
        var doc = contents[i] && contents[i].doc;
        var iframe = doc && doc.defaultView ? doc.defaultView.frameElement : null;
        if (!doc || !iframe) continue;
        var index = pdfDocIndexMap.get(doc);
        if (index === undefined) continue;
        iframe.style.filter = '';
        iframe.style.backgroundColor = currentThemeColors.bg;
        doc.documentElement.style.backgroundColor = currentThemeColors.bg;
        if (doc.body) doc.body.style.backgroundColor = currentThemeColors.bg;
        if (!filter) {
          doc.documentElement.style.setProperty('--readany-pdf-filter', 'none');
          continue;
        }
        var isLight = pdfPageLightCache[index];
        doc.documentElement.style.setProperty(
          '--readany-pdf-filter',
          isLight === false ? 'none' : filter,
        );
      }
    }

    function injectThemeIntoStyles(baseStyles, bg, fg, primary) {
      const cleaned = baseStyles.replace(
        /\/\* __theme_colors__ \*\/[\s\S]*?\/\* __end_theme_colors__ \*\//g,
        '',
      );
      const themeBlock = `/* __theme_colors__ */
html, body {
  background-color: ${bg} !important;
  color: ${fg} !important;
}
::selection { background: rgba(59, 130, 246, 0.3) !important; }
/* __end_theme_colors__ */`;
      return themeBlock + '\n' + cleaned;
    }

    // ─── Document styles ───
    function normalizeBrOnlyParagraphs(doc) {
      if (!doc || doc.__readany_br_paragraphs_normalized) return;
      doc.__readany_br_paragraphs_normalized = true;

      const body = doc.body;
      if (!body || body.querySelectorAll('p').length > 2) return;

      const containers = Array.from(body.querySelectorAll('div, section, article, main'))
        .filter(shouldNormalizeBrParagraphContainer);
      if (shouldNormalizeBrParagraphContainer(body)) containers.push(body);

      for (const container of containers) {
        if (normalizeBrParagraphContainer(doc, container)) return;
      }
    }

    function shouldNormalizeBrParagraphContainer(container) {
      if (!container || container.querySelector('p')) return false;

      const inlineTags = new Set([

      try {

          return { text: '', error: 'no view or renderer' };
        }
        var renderer = view.renderer;
        var contents = renderer.getContents && renderer.getContents();
        if (!contents || !contents[0] || !contents[0].doc) {
          return { text: '', error: 'no contents or doc' };
        }
        var doc = contents[0].doc;
        var win = doc.defaultView;
        if (!win) {
          return { text: '', error: 'no win' };
        }

        var texts = [];

        // Check if we're in paginated mode (CSS columns)
        var isPaginated = !renderer.scrolled;
        var pSize = renderer.size;   // container visible width (one page)
        var pStart = renderer.start; // abs(scrollLeft)

        var walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
          acceptNode: function(node) {
            if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_SKIP;
            if (isTTSFootnoteMarker(node.nodeValue)) return NodeFilter.FILTER_REJECT;
            if (shouldSkipTTSNode(node.parentElement)) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        });

        var textNode = walker.nextNode();
        var nodeCount = 0;
        var visibleCount = 0;
        var firstRectInfo = null;
        while (textNode) {
          nodeCount++;
          var range = doc.createRange();
          range.selectNodeContents(textNode);
          var rect = range.getBoundingClientRect();
          
          if (nodeCount === 1) {
            firstRectInfo = { left: rect.left, right: rect.right, width: rect.width };
          }
          
          var isVisible = false;
          if (isPaginated && pSize > 0) {
            // In paginated mode, the iframe is expanded to the full content width.
            // The outer container scrolls to show the current "page".
            // First page starts at scroll offset = pSize (page 0 is padding).
            // So visible range in iframe coords is [start - size, end - size].
            var visibleLeft = pStart - pSize;
            var visibleRight = pStart;
            isVisible = rect.right > visibleLeft && rect.left < visibleRight && rect.width > 0;
          } else {
            // Scrolled mode: use iframe viewport dimensions
            var vw = win.innerWidth;
            var vh = win.innerHeight;
            isVisible = rect.width > 0 && rect.height > 0 &&
                rect.right > 0 && rect.left < vw &&
                rect.bottom > 0 && rect.top < vh;
          }
          
          if (isVisible) {
            visibleCount++;
            var t = normalizeTTSText(textNode.nodeValue);
            if (t) { texts.push(t); }
          }
          textNode = walker.nextNode();
        }
        
        var result = normalizeTTSText(texts.join(' '));
        return { 
          text: result, 
          debug: {
            isPaginated: isPaginated,
            pSize: pSize,
            pStart: pStart,
            nodeCount: nodeCount,
            visibleCount: visibleCount,
            firstRect: firstRectInfo
          }
        };
      } catch (e) { 
        return { text: '', error: String(e) };
      }
    }

    function getCurrentRendererContent() {
      const contents = getRendererContents();
      return contents[0] || null;
    }

    function anchorToRange(doc, anchor) {
      if (!doc || !anchor) return null;
      if (anchor instanceof Range) return anchor;
      if (!(anchor instanceof Node)) return null;
      try {
        const range = doc.createRange();
        if (anchor.nodeType === Node.TEXT_NODE) {
          range.selectNodeContents(anchor);
        } else {
          range.selectNode(anchor);
        }
        return range;
      } catch (e) {
        console.log('[ttsRange] failed to normalize anchor:', e);
        return null;
      }
    }

    function resolveRangeForCfi(cfi) {
      if (!view || !cfi || !view.resolveCFI) return null;
      const contents = getRendererContents();
      if (!contents.length) return null;

      try {
        const resolved = view.resolveCFI(cfi);
        if (!resolved) return null;

        if (resolved.index != null) {
          const direct = contents.find((content) => content.index === resolved.index && content.doc);
          if (direct?.doc && typeof resolved.anchor === 'function') {
            try {
              const range = anchorToRange(direct.doc, resolved.anchor(direct.doc));
              if (range) return { range, doc: direct.doc, index: direct.index ?? resolved.index };
            } catch {}
          }
        }

        if (typeof resolved.anchor === 'function') {
          for (const content of contents) {
            if (!content?.doc) continue;
            try {
              const range = anchorToRange(content.doc, resolved.anchor(content.doc));
              if (range) return { range, doc: content.doc, index: content.index ?? resolved.index ?? 0 };
            } catch {}
          }
        }
      } catch (e) {
        console.log('[ttsRange] failed to resolve CFI:', e);
      }

      return null;
    }

    function getPaginatedVisibleRangeCandidates(renderer) {
      const start = Number(renderer && renderer.start || 0);
      const end = Number(renderer && renderer.end || 0);
      const size = Number(renderer && renderer.size || 0);
      const candidates = [];

      if (Number.isFinite(start) && Number.isFinite(size) && size > 0) {
        candidates.push({ left: start - size, right: start, source: 'legacy-offset' });
        candidates.push({ left: start, right: start + size, source: 'size-fallback' });
      }

      if (Number.isFinite(start) && Number.isFinite(end) && end > start) {
        candidates.push({ left: start, right: end, source: 'renderer' });
      }

      return candidates.filter((candidate, index, list) => {
        return candidate.right > candidate.left &&
          list.findIndex((item) => item.left === candidate.left && item.right === candidate.right) === index;
      });
    }

    function rectIntersectsPaginatedRange(rect, range) {
      return rect.right > range.left && rect.left < range.right;
    }

    function scorePaginatedVisibleRange(doc, range) {
      if (!doc || !doc.body) return 0;
      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
        acceptNode: function (node) {
          if (isInsideRubyAnnotation(node)) return NodeFilter.FILTER_REJECT;
          if (isTTSFootnoteMarker(node.nodeValue || '')) return NodeFilter.FILTER_REJECT;
          if (shouldSkipTTSNode(node.parentElement)) return NodeFilter.FILTER_REJECT;
          return node.nodeValue && normalizeTTSText(node.nodeValue)
            ? NodeFilter.FILTER_ACCEPT
            : NodeFilter.FILTER_SKIP;
        },
      });
      let score = 0;
      let visited = 0;
      let textNode = walker.nextNode();
      while (textNode && visited < 500) {
        visited += 1;
        const text = normalizeTTSText(textNode.nodeValue || '');
        if (text) {
          try {
            const textRange = doc.createRange();
            textRange.selectNodeContents(textNode);
            const rects = Array.from(textRange.getClientRects ? textRange.getClientRects() : []);
            if (rects.some((rect) => rect.width > 0 && rect.height > 0 && rectIntersectsPaginatedRange(rect, range))) {

            }
          } catch {}
        }
        textNode = walker.nextNode();
      }
      return score;
    }

    function pickPaginatedVisibleRange(doc, renderer) {
      const candidates = getPaginatedVisibleRangeCandidates(renderer);
      if (candidates.length <= 1) return candidates[0] || null;

      const legacyRange = candidates.find((range) => range.source === 'legacy-offset') || null;
      if (legacyRange && scorePaginatedVisibleRange(doc, legacyRange) > 0) return legacyRange;

      const rendererRange = candidates.find((range) => range.source === 'renderer') || null;
      if (rendererRange && scorePaginatedVisibleRange(doc, rendererRange) > 0) return rendererRange;

      const fallbackRange = candidates.find((range) => range.source === 'size-fallback') || null;
      if (fallbackRange && scorePaginatedVisibleRange(doc, fallbackRange) > 0) return fallbackRange;

      return legacyRange || rendererRange || fallbackRange || candidates[0] || null;
    }

    let ttsVisibleRangeByDoc = new WeakMap();

    function getVisibleRangeForTTSDoc(doc, renderer) {
      if (!doc) return null;
      if (ttsVisibleRangeByDoc.has(doc)) return ttsVisibleRangeByDoc.get(doc) || null;
      const range = pickPaginatedVisibleRange(doc, renderer);
      ttsVisibleRangeByDoc.set(doc, range);
      return range;
    }

    function getRangeDocument(range) {
      const container = range && range.commonAncestorContainer;
      if (!container) return null;
      return container.nodeType === Node.DOCUMENT_NODE ? container : container.ownerDocument;
    }

    function getReaderViewportRect() {
      const viewport = {
        left: 0,
        top: 0,
        right: window.innerWidth || document.documentElement.clientWidth || 0,
        bottom: window.innerHeight || document.documentElement.clientHeight || 0,
      };
      try {
        const viewRect = view && view.getBoundingClientRect ? view.getBoundingClientRect() : null;
        if (!viewRect || viewRect.width <= 0 || viewRect.height <= 0) return viewport;
        return {
          left: Math.max(viewRect.left, viewport.left),
          top: Math.max(viewRect.top, viewport.top),
          right: Math.min(viewRect.right, viewport.right),
          bottom: Math.min(viewRect.bottom, viewport.bottom),
        };
      } catch (e) {
        return viewport;
      }
    }

    function mapIframeRectToHost(rect, doc) {
      try {
        const iframe = doc && doc.defaultView && doc.defaultView.frameElement;
        if (!iframe || !iframe.getBoundingClientRect) return rect;
        const iframeRect = iframe.getBoundingClientRect();
        const scaleX = iframe.clientWidth > 0 ? iframeRect.width / iframe.clientWidth : 1;
        const scaleY = iframe.clientHeight > 0 ? iframeRect.height / iframe.clientHeight : 1;
        return {
          left: iframeRect.left + rect.left * scaleX,
          top: iframeRect.top + rect.top * scaleY,
          right: iframeRect.left + rect.right * scaleX,
          bottom: iframeRect.top + rect.bottom * scaleY,
          width: rect.width * scaleX,
          height: rect.height * scaleY,
        };
      } catch (e) {

      }
    }

    function isHostRectVisible(rect) {
      if (!rect || rect.width <= 0 || rect.height <= 0) return false;
      const viewport = getReaderViewportRect();
      return rect.right > viewport.left &&
        rect.left < viewport.right &&
        rect.bottom > viewport.top &&
        rect.top < viewport.bottom;

    function getContentHostRect(content) {
      const doc = content && content.doc;
      const iframe = doc && doc.defaultView && doc.defaultView.frameElement;

        return {
          left: rect.left,
          top: rect.top,
          right: rect.right,
          bottom: rect.bottom,
          width: rect.width,
          height: rect.height,
        };
      }
      if (doc && doc.body) {
        return mapIframeRectToHost(doc.body.getBoundingClientRect(), doc);
      }
      return null;
    }

    function getVisibleContentsForTTS(contents, renderer) {
      if (!renderer || !renderer.scrolled) return contents;
      return (contents || [])
        .filter(function(content) { return !!(content && content.doc); })
        .map(function(content) {
          return { content: content, rect: getContentHostRect(content) };
        })
        .filter(function(item) {
          return item.rect && isHostRectVisible(item.rect);

        .sort(function(a, b) {

            ? topDelta
