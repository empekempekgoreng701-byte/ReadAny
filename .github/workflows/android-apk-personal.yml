# Personal Android APK build (manual trigger only).
#
# Runs on GitHub-hosted ubuntu-latest (16 GB RAM) — no laptop resources used.
# Output: debug-signed release APK (arm64-v8a) as a workflow artifact.
# Release is signed with the in-repo debug.keystore (same as local builds),
# so no secrets are required.
#
# NOTE: personal use only. Upstream (codedogQBY/ReadAny) has its own
# release.yml; this file is meant for a personal fork.

name: Android APK (personal)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "App variant (APP_VARIANT)"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: ${{ inputs.variant || 'preview' }}
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build reader web assets
        run: pnpm --filter @readany/app-expo run build:reader

      - name: Generate Android native project (prebuild)
        working-directory: packages/app-expo
        run: npx expo prebuild --platform android --no-install

      - name: Assemble release APK (arm64-v8a)
        working-directory: packages/app-expo/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --max-workers=2

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadAny-${{ inputs.variant || 'preview' }}-arm64-apk
          path: packages/app-expo/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
